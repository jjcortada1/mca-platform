    wrapTbl.appendChild(tbl);offersWrap.appendChild(wrapTbl);
    offersWrap.appendChild(div({style:{fontSize:'11px',color:'#9ca3af',marginTop:'6px'}},'Click "⇆ Compare" again to edit individual offers.'));
  }

  function renderOffers(){compareMode?renderOffersCompare():renderOffersStacked();}
  compareBtn.onclick=()=>{compareMode=!compareMode;compareBtn.textContent=compareMode?'✎ Edit':'⇆ Compare';renderOffers();};
  renderOffers();

  // ── FUNDING DETAILS (only when status === 'Funded') ───────────────────
  // These are the per-deal funding specifics: who funded it, when, the
  // actual amount/factor/term/payment used, plus paydown inputs (frequency
  // + scheduled payment). Hidden until the deal status is Funded so the
  // Active Deals modal stays focused on pipeline work. Auto-populated from
  // the accepted offer on first transition; editable here afterwards.
  const fdSec=div({style:{marginTop:'16px',padding:'14px',border:'1.5px solid #bbf7d0',background:'#f0fdf4',borderRadius:'10px'}});
  const fdHdr=div({style:{fontSize:'12px',fontWeight:'700',color:'#065f46',marginBottom:'8px',display:'flex',alignItems:'center',justifyContent:'space-between'}});
  fdHdr.appendChild(span({},'💵 Funding Details'));
  fdHdr.appendChild(span({style:{fontSize:'10px',fontWeight:'500',color:'#16a34a'}},'Used for paydown tracking'));
  fdSec.appendChild(fdHdr);

  const fd=d.funded_details||{};
  // Local working copy — mutated as user types; written back into
  // d.funded_details on every change so the save flow picks it up.
  const fdState={
    funder:fd.funder||'',
    funded_date:fd.funded_date||'',
    funded_amount:fd.funded_amount||'',
    factor_rate:fd.factor_rate||'',
    term:fd.term||'',
    term_unit:fd.term_unit||'days',
    payment_frequency:fd.payment_frequency||'daily',
    scheduled_payment:fd.scheduled_payment||'',
    fees:fd.fees||'',
    notes:fd.notes||'',
  };
  const fdGrid=div({style:{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(140px,1fr))',gap:'8px'}});

  function mkFd(lbl,key,opts={}){
    const f=div({});
    f.appendChild(div({style:{fontSize:'10px',fontWeight:'600',color:'#374151',marginBottom:'3px',textTransform:'uppercase',letterSpacing:'.04em'}},lbl));
    let input;
    if(opts.type==='date'){input=inp({type:'date',style:{padding:'7px 9px',width:'100%'}});input.value=fdState[key];}
    else if(opts.type==='select'){input=sel({style:{padding:'7px 9px',width:'100%',fontSize:'13px'}});opts.options.forEach(o=>input.appendChild(opt(o,o,fdState[key]===o)));}
    else {input=inp({type:opts.type||'number',placeholder:opts.placeholder||'',step:opts.step||'',style:{padding:'7px 9px',width:'100%'}});input.value=fdState[key];}
    input.oninput=input.onchange=e=>{
      fdState[key]=e.target.value;
      // Promote local state back into the deal payload for save.
      d.funded_details={...fdState};
    };
    f.appendChild(input);
    return f;
  }

  fdGrid.appendChild(mkFd('Funder','funder',{type:'text',placeholder:'Who funded it?'}));
  fdGrid.appendChild(mkFd('Funded Date','funded_date',{type:'date'}));
  fdGrid.appendChild(mkFd('Funded $','funded_amount',{placeholder:'0'}));
  fdGrid.appendChild(mkFd('Factor','factor_rate',{step:'0.01',placeholder:'1.35'}));
  // Term + unit pair
  const termPair=div({});
  termPair.appendChild(div({style:{fontSize:'10px',fontWeight:'600',color:'#374151',marginBottom:'3px',textTransform:'uppercase',letterSpacing:'.04em'}},'Term'));
  const termPairWrap=div({style:{display:'flex',gap:'4px'}});
  const fdTermIn=inp({type:'number',placeholder:'60',style:{flex:'1',padding:'7px 9px',minWidth:'0'}});fdTermIn.value=fdState.term;fdTermIn.oninput=e=>{fdState.term=e.target.value;d.funded_details={...fdState};};
  const fdTermU=sel({style:{padding:'7px 4px',fontSize:'11px'}});['days','weeks','months'].forEach(u=>fdTermU.appendChild(opt(u,u,fdState.term_unit===u)));fdTermU.onchange=e=>{fdState.term_unit=e.target.value;d.funded_details={...fdState};};
  termPairWrap.appendChild(fdTermIn);termPairWrap.appendChild(fdTermU);termPair.appendChild(termPairWrap);
  fdGrid.appendChild(termPair);
  fdGrid.appendChild(mkFd('Pay Freq','payment_frequency',{type:'select',options:['daily','weekly','bi-weekly','monthly']}));
  fdGrid.appendChild(mkFd('Scheduled Payment $','scheduled_payment',{placeholder:'0'}));
  fdGrid.appendChild(mkFd('Fees $','fees',{placeholder:'0'}));
  fdSec.appendChild(fdGrid);

  const fdNote=inp({placeholder:'Funding notes (optional)',style:{padding:'7px 9px',width:'100%',marginTop:'8px',fontSize:'12px'}});
  fdNote.value=fdState.notes;
  fdNote.oninput=e=>{fdState.notes=e.target.value;d.funded_details={...fdState};};
  fdSec.appendChild(fdNote);

  // Hint about auto-fill from accepted offer when not yet funded
  const fdHint=div({style:{fontSize:'11px',color:'#15803d',marginTop:'8px',fontStyle:'italic'}});
  fdHint.textContent='Tip: mark an offer "Accepted" above before changing status to Funded — these fields will auto-fill from it.';
  fdSec.appendChild(fdHint);

  // ── PAYDOWN TRACKER (Phase 5) ───────────────────────────────────────
  // Live-calculated paydown summary based on the funding-details inputs
  // above. Updates whenever the user edits a relevant field so they see
  // immediate impact. Empty state shown when inputs aren't sufficient.
  const pdBlock=div({style:{marginTop:'14px',padding:'14px',border:'1.5px solid #d1fae5',background:'#f0fdf4',borderRadius:'10px'}});
  const pdHdr=div({style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'10px'}});
  pdHdr.appendChild(div({style:{fontSize:'12px',fontWeight:'700',color:'#065f46'}},'📊 Paydown Tracker'));
  const pdAsOf=div({style:{fontSize:'10px',color:'#16a34a'}},'as of '+new Date().toLocaleDateString());
  pdHdr.appendChild(pdAsOf);
  pdBlock.appendChild(pdHdr);
  const pdEmpty=div({style:{fontSize:'12px',color:'#16a34a',fontStyle:'italic'}});
  pdEmpty.textContent='Fill in Funded Date, Funded $, Factor, and Scheduled Payment above to see real-time paydown progress.';
  pdBlock.appendChild(pdEmpty);
  // The body of the tracker is built dynamically by refreshPaydown() so
  // edits to the funding-details inputs update everything in place.
  const pdBody=div({});
  pdBlock.appendChild(pdBody);
  fdSec.appendChild(pdBlock);

  function refreshPaydown(){
    const s=paydownStats(fdState);
    pdBody.innerHTML='';
    if(!s){pdEmpty.style.display='block';return;}
    pdEmpty.style.display='none';

    // Big % + progress bar (the "continuous progress bar" the spec calls
    // for — moves with actual paydown, not 25/50/75/100 milestones).
    const headRow=div({style:{display:'flex',alignItems:'baseline',justifyContent:'space-between',marginBottom:'4px'}});
    headRow.appendChild(div({style:{fontSize:'28px',fontWeight:'800',color:'#065f46'}},s.pct.toFixed(1)+'%'));
    headRow.appendChild(div({style:{fontSize:'12px',color:'#16a34a',fontWeight:'600'}},'paid in'));
    pdBody.appendChild(headRow);
    pdBody.appendChild(paydownBar(s.pct,'12px'));

    // Stat grid — Paid / Remaining / Total / Periods remaining.
    const grid=div({style:{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(120px,1fr))',gap:'8px',marginTop:'12px'}});
    function pdCell(lbl,val,sub){
      const c=div({style:{background:'#fff',border:'1px solid #bbf7d0',borderRadius:'7px',padding:'8px 10px'}});
      c.appendChild(div({style:{fontSize:'10px',color:'#16a34a',textTransform:'uppercase',letterSpacing:'.04em',marginBottom:'2px',fontWeight:'600'}},lbl));
      c.appendChild(div({style:{fontSize:'14px',fontWeight:'700',color:'#065f46'}},val));
      if(sub)c.appendChild(div({style:{fontSize:'10px',color:'#16a34a',marginTop:'2px'}},sub));
      return c;
    }
    grid.appendChild(pdCell('Total Payback',fmt$(s.payback)));
    grid.appendChild(pdCell('Paid So Far',fmt$(s.paid),s.elapsed+' '+freqLabel(s.freq)+' debits'));
    grid.appendChild(pdCell('Remaining Balance',fmt$(s.remaining),(100-s.pct).toFixed(1)+'% remaining'));
    grid.appendChild(pdCell('Periods Left',s.remainingPeriods+' of '+s.totalPeriods,freqLabel(s.freq)+' payments'));
    if(s.projectedEnd){
      grid.appendChild(pdCell('Projected Payoff',s.projectedEnd.toLocaleDateString(),'at current pace'));
    }
    pdBody.appendChild(grid);

    // Renewal eligibility block — calls out NOW vs SOON vs LATER so the
    // rep can plan follow-up timing without doing the math themselves.
    const renewBox=div({style:{marginTop:'12px',padding:'10px 12px',borderRadius:'8px',display:'flex',alignItems:'center',gap:'10px',flexWrap:'wrap'}});
    const renewIcon=div({style:{fontSize:'20px'}});
    const renewText=div({style:{flex:'1',minWidth:'180px'}});
    if(s.isEligible){
      renewBox.style.background='#dcfce7';renewBox.style.border='1px solid #86efac';
      renewIcon.textContent='✓';
      renewText.appendChild(div({style:{fontSize:'13px',fontWeight:'700',color:'#166534'}},'Eligible for renewal'));
      renewText.appendChild(div({style:{fontSize:'11px',color:'#15803d'}},'Merchant has paid in '+s.pct.toFixed(1)+'% — above the '+(s.renewalThreshold*100).toFixed(0)+'% threshold. Good time to reach out.'));
    } else {
      const isClose=s.periodsUntilEligible<=20;
      renewBox.style.background=isClose?'#fef3c7':'#f3f4f6';
      renewBox.style.border=isClose?'1px solid #fde68a':'1px solid #e5e7eb';
      renewIcon.textContent=isClose?'⏳':'○';
      const pct=(s.renewalThreshold*100).toFixed(0);
      renewText.appendChild(div({style:{fontSize:'13px',fontWeight:'700',color:isClose?'#92400e':'#374151'}},isClose?'Renewal eligibility soon':'Not yet eligible for renewal'));
      renewText.appendChild(div({style:{fontSize:'11px',color:isClose?'#a16207':'#6b7280'}},
        'Needs '+fmt$(s.amountUntilEligible)+' more in payments (~'+s.periodsUntilEligible+' '+freqLabel(s.freq)+(s.periodsUntilEligible===1?'':'s')+') to cross the '+pct+'% threshold.'));
    }
    renewBox.appendChild(renewIcon);renewBox.appendChild(renewText);
    pdBody.appendChild(renewBox);
  }

  // Hook into every funding-details input so paydown updates live as the
  // user edits. We watch the whole fdSec for changes since each input
  // updates fdState on input/change before bubbling here.
  fdSec.addEventListener('input',refreshPaydown);
  fdSec.addEventListener('change',refreshPaydown);
  refreshPaydown();

  // Only show the funding-details section once the deal is Funded.
  // Hidden while it's still in pipeline (New/Working/Approved/Dead) so
  // the modal stays compact. Updates live as the status dropdown changes.
  function updateFdVisibility(){
    fdSec.style.display=(d.status==='Funded')?'block':'none';
    // The hint is only useful BEFORE the data is filled in.
    fdHint.style.display=(d.status==='Funded'&&!fdState.funder)?'block':'none';
  }
  updateFdVisibility();
  // Wire to the status dropdown so toggling status reveals/hides the section.
  statusSelM.addEventListener('change',()=>{
    d.status=statusSelM.value;
    updateFdVisibility();
  });
  body.appendChild(fdSec);

  const msg=div({style:{fontSize:'12px',marginTop:'12px',display:'none',padding:'8px 12px',borderRadius:'6px'}});body.appendChild(msg);
  // Log Submission section (only for existing deals)
  if(!isNew){
    const subSec=div({style:{marginTop:'16px',paddingTop:'14px',borderTop:'1px solid #f0f0f0'}});
    subSec.appendChild(div({style:{fontSize:'12px',fontWeight:'700',color:'#374151',marginBottom:'8px'}},'Funders Submitted To'));
    subSec.appendChild(div({style:{fontSize:'11px',color:'#9ca3af',marginBottom:'10px'}},'Log funders this deal was sent to manually, without sending an email.'));
    const logSubBtn=btn({className:'btn btn-ghost btn-sm',style:{fontSize:'12px'}},'+ Log Submission');
    logSubBtn.onclick=()=>{
      closeModal('deal-modal');
      openManualSubModal(()=>{onSave();},deal.deal_name);
    };
    subSec.appendChild(logSubBtn);
    body.appendChild(subSec);
  }

  const btnRow=div({style:{display:'flex',gap:'8px',justifyContent:'space-between',marginTop:'16px'}});
  const saveBtn=btn({className:'btn btn-primary'},'Save Deal');
  const cancelBtn=btn({className:'btn btn-ghost'},'Cancel');
  cancelBtn.onclick=()=>closeModal('deal-modal');
  const leftBtns=div({style:{display:'flex',gap:'8px'}});leftBtns.appendChild(saveBtn);
  if(!isNew&&(isEditing()||deal.created_by===currentUser.id)){
    const delBtn=btn({className:'btn btn-danger'},'Delete');
    delBtn.onclick=async()=>{if(!confirm('Delete this deal?'))return;await api.del('/api/active-deals/'+deal.id);closeModal('deal-modal');onSave();};
    leftBtns.appendChild(delBtn);
  }
  btnRow.appendChild(leftBtns);btnRow.appendChild(cancelBtn);body.appendChild(btnRow);

  saveBtn.onclick=async()=>{
    if(!d.deal_name.trim()){msg.textContent='Deal name required.';msg.style.display='block';msg.style.background='#fef2f2';msg.style.color='#991b1b';return;}
    saveBtn.textContent='Saving…';saveBtn.disabled=true;
    const r=isNew?await api.post('/api/active-deals',d):await api.put('/api/active-deals/'+deal.id,d);
    saveBtn.textContent='Save Deal';saveBtn.disabled=false;
    if(r.ok){closeModal('deal-modal');onSave();}
    else{msg.textContent=r.error||'Error';msg.style.display='block';msg.style.background='#fef2f2';msg.style.color='#991b1b';}
  };
  openModal('deal-modal');
}

// ── MANUAL SUBMISSION ENTRY ──────────────────────────────────────────────────
function openManualSubModal(onSave, prefillDealName=''){
  ensureModal('manual-sub-modal','Log Deal Manually');
  const body=document.getElementById('manual-sub-modal-body');
  body.innerHTML='';

  const lbl=(t,hint)=>{const w=div({style:{marginBottom:'14px'}});const l=div({style:{fontSize:'12px',fontWeight:'600',color:'#374151',marginBottom:'5px'}});l.textContent=t;w.appendChild(l);if(hint){const h2=div({style:{fontSize:'11px',color:'#9ca3af',marginBottom:'6px'}});h2.textContent=hint;w.appendChild(h2);}return w;};

  // Deal name
  const nameWrap=lbl('Business / Deal Name *');
  const nameInp=inp({placeholder:'Business name',style:{padding:'9px 11px',width:'100%',boxSizing:'border-box',fontSize:'14px'}});
  if(prefillDealName) nameInp.value=prefillDealName;
  nameWrap.appendChild(nameInp);
  body.appendChild(nameWrap);

  // Funders list
  const funderEntries=[];
  const funderWrap=lbl('Funders Submitted To','Add each funder and their response status');
  const funderRows=div({});
  funderWrap.appendChild(funderRows);
  body.appendChild(funderWrap);

  function addFunderRow(fname='',fstatus='No Response',fnotes=''){
    const entry={};
    const rowGroup=div({style:{display:'flex',flexDirection:'column',gap:'6px',marginBottom:'8px',padding:'10px 12px',background:'#f9fafb',border:'1px solid #e5e7eb',borderRadius:'8px'}});
    const topRow=div({style:{display:'flex',gap:'8px',alignItems:'center'}});
    const nameI=inp({placeholder:'Funder name',style:{flex:'2',padding:'8px 10px',fontSize:'13px'}});
    nameI.value=fname;
    const statSel=sel({style:{flex:'1',padding:'8px 10px',fontSize:'13px'}});
    ['No Response','Approved','Declined','Counter','Portal Only'].forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s;if(s===fstatus)o.selected=true;statSel.appendChild(o);});
    const rmB=btn({style:{padding:'6px 10px',background:'none',border:'1px solid #fca5a5',color:'#dc2626',borderRadius:'6px',cursor:'pointer',fontSize:'16px',lineHeight:'1',flexShrink:'0',fontFamily:'inherit'}});
    rmB.textContent='×';
    rmB.onclick=()=>{funderRows.removeChild(rowGroup);funderEntries.splice(funderEntries.indexOf(entry),1);};
    topRow.appendChild(nameI);topRow.appendChild(statSel);topRow.appendChild(rmB);
    const noteI=inp({placeholder:'Notes (optional)',style:{width:'100%',padding:'7px 10px',fontSize:'12px',boxSizing:'border-box'}});
    noteI.value=fnotes;
    rowGroup.appendChild(topRow);rowGroup.appendChild(noteI);
    funderRows.appendChild(rowGroup);
    entry.nameI=nameI;entry.statSel=statSel;entry.noteI=noteI;
    funderEntries.push(entry);
  }
  addFunderRow();

  const addFBtn=btn({className:'btn btn-ghost btn-sm',style:{marginBottom:'16px'}});
  addFBtn.textContent='+ Add Funder';
  addFBtn.onclick=()=>addFunderRow();
  body.appendChild(addFBtn);

  // Notes
  const notesWrap=lbl('Notes (optional)');
  const notesTA=document.createElement('textarea');
  notesTA.placeholder='Any context about this submission…';
  notesTA.style.cssText='width:100%;padding:9px 11px;height:70px;resize:vertical;font-family:inherit;font-size:13px;box-sizing:border-box;border:1px solid #d1d5db;border-radius:6px;';
  notesWrap.appendChild(notesTA);
  body.appendChild(notesWrap);

  const errMsg=div({style:{display:'none',padding:'10px 12px',background:'#fef2f2',border:'1px solid #fca5a5',borderRadius:'6px',fontSize:'13px',color:'#991b1b',marginBottom:'12px'}});
  body.appendChild(errMsg);

  const saveBtn=document.createElement('button');
  saveBtn.className='btn btn-primary';
  saveBtn.style.cssText='width:100%;justify-content:center;padding:12px;font-size:14px;';
  saveBtn.textContent='Save Submission';
  saveBtn.onclick=async()=>{
    const dealName=nameInp.value.trim();
    if(!dealName){errMsg.textContent='Deal name is required';errMsg.style.display='block';return;}
    errMsg.style.display='none';
    saveBtn.disabled=true;saveBtn.textContent='Saving…';
    const funders=funderEntries.map(e=>({name:e.nameI.value.trim(),status:e.statSel.value,notes:e.noteI.value.trim()})).filter(f=>f.name);
    const r=await api.post('/api/submissions/manual',{deal_name:dealName,notes:notesTA.value,funders});
    saveBtn.disabled=false;saveBtn.textContent='Save Submission';
    if(r.ok){closeModal('manual-sub-modal');if(onSave)onSave();}
    else{errMsg.textContent=r.error||'Error saving — please try again.';errMsg.style.display='block';}
  };
  body.appendChild(saveBtn);
  openModal('manual-sub-modal');
}

// ── SUBMISSIONS ───────────────────────────────────────────────────────────────
async function renderSubmissions(container){
  container.innerHTML='';
  const isAdmin=['admin','superadmin'].includes(currentUser.role);
  const wrap=div({className:'page'});
  const titleRow=div({style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'6px',flexWrap:'wrap',gap:'8px'}});
  titleRow.appendChild(div({className:'page-title',style:{marginBottom:'0'}},'Submission Info'));
  const subScopeNote=div({style:{fontSize:'11px',color:'#9ca3af',marginTop:'2px',marginBottom:'0'}});
  subScopeNote.textContent=isAdmin?'Viewing all submissions in your company.':currentUser.role==='team_leader'?"Viewing your submissions and your team's submissions.":'Viewing your submissions.';
  titleRow.appendChild(subScopeNote);
  const manualBtn=btn({className:'btn btn-primary',style:{fontSize:'13px',padding:'8px 16px'}},'+ Log Deal Manually');
  manualBtn.onclick=()=>openManualSubModal(()=>renderSubmissions(container));
  titleRow.appendChild(manualBtn);
  wrap.appendChild(titleRow);
  wrap.appendChild(div({className:'page-sub',style:{marginBottom:'12px'}},'Track funder submissions and log deals sent outside the system.'));
  const listWrap=div({});wrap.appendChild(listWrap);container.appendChild(wrap);
  const subs=await api.get('/api/submissions');
  if(!subs.length){listWrap.innerHTML='<div style="text-align:center;padding:40px;color:#9ca3af;background:#fff;border-radius:10px;border:1px solid #e5e7eb">No submissions yet. Use Submit tab to send deals, or log one manually.</div>';return;}

  subs.forEach(sub=>{
    const card=div({className:'card',style:{marginBottom:'12px',overflow:'hidden'}});

    // ── Header ──
    const hdr=div({style:{padding:'14px 18px',background:'#f9fafb',borderBottom:'1px solid #e5e7eb',display:'flex',justifyContent:'space-between',alignItems:'flex-start',flexWrap:'wrap',gap:'8px'}});
    const left=div({style:{flex:'1',minWidth:'0'}});
    left.appendChild(div({style:{fontWeight:'700',fontSize:'14px',marginBottom:'2px'}},sub.deal_name));
    const subByDiv=div({style:{fontSize:'12px',color:'#9ca3af',display:'flex',alignItems:'center',gap:'6px',flexWrap:'wrap'}});
    subByDiv.appendChild(document.createTextNode(sub.submitted_by+' · '+new Date(sub.created_at).toLocaleDateString()));
    if(sub.is_manual)subByDiv.appendChild(span({className:'badge badge-dark',style:{fontSize:'10px',padding:'2px 7px'}},'Manual'));
    left.appendChild(subByDiv);
    hdr.appendChild(left);

    // Header buttons
    const hdrBtns=div({style:{display:'flex',gap:'6px',flexShrink:'0',alignItems:'center',flexWrap:'wrap'}});

    // Re-shop button — always visible
    const reShopBtn=btn({className:'btn btn-primary btn-sm',style:{fontSize:'12px'}},'🔁 Shop Again');
    reShopBtn.onclick=()=>openReShopModal(sub,()=>renderSubmissions(container));
    hdrBtns.appendChild(reShopBtn);

    if(isEditing()){
      const delSubBtn=btn({className:'btn btn-ghost btn-sm',style:{color:'#dc2626',borderColor:'#fca5a5'}},'🗑 Delete');
      delSubBtn.onclick=async()=>{if(!confirm('Delete this submission record?'))return;const r=await api.del('/api/submissions/'+sub.id);if(r.ok){listWrap.removeChild(card);}else alert(r.error||'Error');};
      hdrBtns.appendChild(delSubBtn);
    }
    hdr.appendChild(hdrBtns);

    // Stats badges
    const statsCounts={Approved:0,Declined:0,'No Response':0,Counter:0};
    (sub.funder_statuses||[]).forEach(fs=>statsCounts[fs.status]=(statsCounts[fs.status]||0)+1);
    const stats=div({style:{display:'flex',gap:'6px',flexWrap:'wrap',marginTop:'6px'}});
    if(statsCounts.Approved)stats.appendChild(span({className:'badge badge-green',style:{fontSize:'11px',padding:'3px 9px'}},statsCounts.Approved+' Approved'));
    if(statsCounts.Counter)stats.appendChild(span({className:'badge badge-blue',style:{fontSize:'11px',padding:'3px 9px'}},statsCounts.Counter+' Counter'));
    if(statsCounts.Declined)stats.appendChild(span({className:'badge badge-red',style:{fontSize:'11px',padding:'3px 9px'}},statsCounts.Declined+' Declined'));
    if(statsCounts['No Response'])stats.appendChild(span({className:'badge badge-gray',style:{fontSize:'11px',padding:'3px 9px'}},statsCounts['No Response']+' Pending'));
    left.appendChild(stats);
    card.appendChild(hdr);

    // ── Funder rows ──
    const body=div({style:{padding:'0 18px 10px'}});

    // Status sort order — Approved first (positive outcomes up top), then
    // Declined (closed-loop, can be skipped), Counter (still in negotiation),
    // then Pending/Portal at the bottom. The user re-sorts automatically
    // whenever a status changes via the dropdown below.
    const STATUS_RANK={Approved:0,Counter:1,Declined:2,'No Response':3,'Portal Only':3};
    function sortFunders(){
      (sub.funder_statuses||[]).sort((a,b)=>{
        const ra=STATUS_RANK[a.status]??99;
        const rb=STATUS_RANK[b.status]??99;
        if(ra!==rb)return ra-rb;
        // Stable within a rank — alphabetical by funder name.
        return (a.funder_name||'').localeCompare(b.funder_name||'');
      });
    }
    sortFunders();

    function buildFunderRows(){
      body.innerHTML='';
      (sub.funder_statuses||[]).forEach(fs=>{
        const row=div({style:{display:'flex',alignItems:'center',padding:'10px 0',borderBottom:'1px solid #f3f4f6',gap:'10px',flexWrap:'wrap'}});
        const fl=div({style:{minWidth:'120px',flex:'1'}});
        fl.appendChild(div({style:{fontWeight:'600',fontSize:'13px',marginBottom:'2px'}},fs.funder_name));
        if(fs.tier)fl.appendChild(span({style:{fontSize:'11px',color:'#9ca3af'}},TM[fs.tier]||fs.tier));
        row.appendChild(fl);

        const sSel=sel({style:{padding:'6px 10px',fontSize:'12px',fontWeight:'600',borderRadius:'6px',border:'1.5px solid #d1d5db',cursor:'pointer',flexShrink:'0'}});
        ['No Response','Approved','Declined','Counter','Portal Only'].forEach(s=>{sSel.appendChild(opt(s,s,fs.status===s));});
        const setSelColor=v=>{sSel.style.background=v==='Approved'?'#d1fae5':v==='Declined'?'#fee2e2':v==='Counter'?'#dbeafe':'#f9fafb';sSel.style.color=v==='Approved'?'#065f46':v==='Declined'?'#991b1b':v==='Counter'?'#1d4ed8':'#374151';};
        setSelColor(fs.status);
        sSel.onchange=async e=>{
          const newStatus=e.target.value;
          setSelColor(newStatus);
          await api.put('/api/submissions/funders/'+fs.id,{status:newStatus});
          // Persist the new status on the local row + re-sort so Approved
          // bubbles up immediately. Rebuild to reflect the new ordering.
          fs.status=newStatus;
          sortFunders();
          // Update the header stats too so the count badges stay in sync.
          const newCounts={Approved:0,Declined:0,'No Response':0,Counter:0,'Portal Only':0};
          (sub.funder_statuses||[]).forEach(x=>{newCounts[x.status]=(newCounts[x.status]||0)+1;});
          stats.innerHTML='';
          if(newCounts.Approved)stats.appendChild(span({className:'badge badge-green',style:{fontSize:'11px',padding:'3px 9px'}},newCounts.Approved+' Approved'));
          if(newCounts.Counter)stats.appendChild(span({className:'badge badge-blue',style:{fontSize:'11px',padding:'3px 9px'}},newCounts.Counter+' Counter'));
          if(newCounts.Declined)stats.appendChild(span({className:'badge badge-red',style:{fontSize:'11px',padding:'3px 9px'}},newCounts.Declined+' Declined'));
          if(newCounts['No Response'])stats.appendChild(span({className:'badge badge-gray',style:{fontSize:'11px',padding:'3px 9px'}},newCounts['No Response']+' Pending'));
          buildFunderRows();
        };
        row.appendChild(sSel);

        const ni=inp({placeholder:'Notes…',style:{flex:'2',padding:'6px 10px',fontSize:'12px',minWidth:'100px'}});ni.value=fs.notes||'';
        let nt;ni.oninput=()=>{clearTimeout(nt);ni.style.borderColor='#d1d5db';nt=setTimeout(async()=>{await api.put('/api/submissions/funders/'+fs.id,{notes:ni.value});ni.style.borderColor='#16a34a';setTimeout(()=>ni.style.borderColor='',1200);},600);};
        row.appendChild(ni);

        if(isEditing()){
          const xBtn=btn({style:{border:'none',background:'none',cursor:'pointer',color:'#fca5a5',fontSize:'18px',padding:'0',flexShrink:'0',fontFamily:'inherit'}});xBtn.textContent='×';
          xBtn.title='Remove this funder row';
          xBtn.onclick=async()=>{if(!confirm('Remove '+fs.funder_name+' from this submission?'))return;await api.del('/api/submissions/funders/'+fs.id);sub.funder_statuses=sub.funder_statuses.filter(x=>x.id!==fs.id);buildFunderRows();};
          row.appendChild(xBtn);
        }
        body.appendChild(row);
      });

      // ── Add funder row (always visible) ──
      const addRow=div({style:{paddingTop:'10px',display:'flex',gap:'8px',flexWrap:'wrap',alignItems:'center'}});
      const nameI=inp({placeholder:'Funder name *',style:{flex:'2',padding:'7px 10px',fontSize:'13px',minWidth:'130px'}});
      const statusSel=sel({style:{padding:'7px 10px',fontSize:'12px',borderRadius:'6px',border:'1px solid #d1d5db',flexShrink:'0'}});
      ['No Response','Approved','Declined','Counter'].forEach(s=>statusSel.appendChild(opt(s,s)));
      const notesI=inp({placeholder:'Notes (optional)',style:{flex:'3',padding:'7px 10px',fontSize:'12px',minWidth:'100px'}});
      const addBtn=btn({className:'btn btn-ghost btn-sm',style:{flexShrink:'0'}},'+ Add');
      addBtn.onclick=async()=>{
        const name=nameI.value.trim();
        if(!name){nameI.style.borderColor='#dc2626';setTimeout(()=>nameI.style.borderColor='',1500);return;}
        const res=await api.post('/api/submissions/funders/add',{submission_id:sub.id,funder_name:name,status:statusSel.value,notes:notesI.value.trim()});
        if(res.ok){
          sub.funder_statuses=sub.funder_statuses||[];
          sub.funder_statuses.push({id:res.id,funder_name:name,tier:'',status:statusSel.value,notes:notesI.value.trim()});
          // Apply ranking immediately so the new row appears in its sorted spot.
          sortFunders();
          nameI.value='';notesI.value='';statusSel.value='No Response';
          buildFunderRows();
        } else alert(res.error||'Error adding funder');
      };
      addRow.appendChild(span({style:{fontSize:'12px',color:'#9ca3af',flexBasis:'100%',marginBottom:'2px'}},'Add a funder result:'));
      addRow.appendChild(nameI);addRow.appendChild(statusSel);addRow.appendChild(notesI);addRow.appendChild(addBtn);
      body.appendChild(addRow);
    }

    buildFunderRows();
    card.appendChild(body);
    listWrap.appendChild(card);
  });
}

// ── Re-shop modal: pre-fill Submit tab for an existing submission ─────────────
function openReShopModal(sub, onDone){
  const id='reshop-modal';
  let m=document.getElementById(id);
  if(m)m.remove();
  m=document.createElement('div');m.id=id;
  m.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px';
  const box=div({style:{background:'#fff',borderRadius:'14px',width:'100%',maxWidth:'480px',padding:'28px',boxShadow:'0 20px 60px rgba(0,0,0,.3)'}});

  box.appendChild(div({style:{fontWeight:'700',fontSize:'16px',marginBottom:'6px'}},'🔁 Shop Again — '+sub.deal_name));
  box.appendChild(div({style:{fontSize:'13px',color:'#6b7280',marginBottom:'20px'}},'This will open the Submit tab pre-filled with this deal. Choose which funders to skip (already submitted).'));

  const alreadySent=new Set((sub.funder_statuses||[]).map(f=>f.funder_name));
  if(alreadySent.size){
    const sentNote=div({style:{background:'#f9fafb',border:'1px solid #e5e7eb',borderRadius:'8px',padding:'10px 14px',marginBottom:'16px',fontSize:'12px'}});
    sentNote.appendChild(div({style:{fontWeight:'600',marginBottom:'6px',color:'#374151'}},'Already submitted to:'));
    const chips=div({style:{display:'flex',flexWrap:'wrap',gap:'5px'}});
    alreadySent.forEach(n=>{const c=div({style:{padding:'3px 10px',background:'#fee2e2',color:'#991b1b',borderRadius:'10px',fontSize:'11px',fontWeight:'600'}});c.textContent=n;chips.appendChild(c);});
    sentNote.appendChild(chips);
    box.appendChild(sentNote);
  }

  const skipChk=div({style:{display:'flex',alignItems:'center',gap:'8px',marginBottom:'18px',cursor:'pointer'}});
  const chkBox=inp({type:'checkbox',style:{width:'16px',height:'16px',cursor:'pointer'}});chkBox.checked=true;
  const chkLbl=span({style:{fontSize:'13px',color:'#374151'}});chkLbl.textContent='Auto-hide already-submitted funders in the funder list';
  skipChk.appendChild(chkBox);skipChk.appendChild(chkLbl);
  skipChk.onclick=()=>chkBox.checked=!chkBox.checked;
  box.appendChild(skipChk);

  const row=div({style:{display:'flex',gap:'10px',justifyContent:'flex-end',marginTop:'8px'}});
  const cancelBtn=btn({className:'btn btn-ghost'},'Cancel');cancelBtn.onclick=()=>m.remove();
  const goBtn=btn({className:'btn btn-primary'},'Open Submit Tab →');
  goBtn.onclick=()=>{
    m.remove();
    // Store prefill data including original notes and submission_id to append results to same record
    window._reShopPrefill={
      deal_name: sub.deal_name,
      notes: sub.notes||'',
      submission_id: sub.id,
      skip: chkBox.checked?alreadySent:new Set()
    };
    renderedTabs['submit']=false;
    showTab('submit');
    if(onDone)onDone();
  };
  row.appendChild(cancelBtn);row.appendChild(goBtn);
  box.appendChild(row);
  m.appendChild(box);
  m.onclick=e=>{if(e.target===m)m.remove();};
  document.body.appendChild(m);
}


// ── FUNDED BOARD ──────────────────────────────────────────────────────────────
async function renderFundedBoard(container){
  container.innerHTML='';
  const isAdmin=['admin','superadmin'].includes(currentUser.role);
  const co=await api.get('/api/company');
  const repList=JSON.parse(co.rep_list||'[]');
  const wrap=div({className:'page-wide'});
  wrap.appendChild(div({className:'page-title',style:{marginBottom:'4px'}},'🏆 Funded Board'));
  wrap.appendChild(div({className:'page-sub'},'Each rep\'s funded deals side by side.'));
  // Total banner
  const banner=div({className:'card',style:{padding:'14px 20px',marginBottom:'16px',display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:'10px'}});
  const totalAmt=div({style:{fontSize:'28px',fontWeight:'800'}},'-');
  const bannerLeft=div({});bannerLeft.appendChild(div({style:{fontSize:'11px',color:'#9ca3af',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:'2px'}},'Total Funded'));bannerLeft.appendChild(totalAmt);banner.appendChild(bannerLeft);
  if(isEditing()){const clr=btn({className:'btn btn-ghost btn-sm',style:{color:'#dc2626',borderColor:'#fca5a5'}},'🗑 Clear Board');clr.onclick=async()=>{if(!confirm('Clear board?'))return;await api.del('/api/funded-board');loadBoard();};banner.appendChild(clr);}
  wrap.appendChild(banner);
  if(!repList.length){wrap.appendChild(div({style:{padding:'30px',textAlign:'center',color:'#9ca3af',background:'#fff',borderRadius:'10px',border:'1px solid #e5e7eb'}},'No reps configured yet. Add reps in Admin → Settings.'));container.appendChild(wrap);return;}
  const boardGrid=div({style:{display:'flex',flexWrap:'nowrap',gap:'10px',alignItems:'flex-start'}});
  wrap.appendChild(boardGrid);container.appendChild(wrap);
  async function loadBoard(){
    boardGrid.innerHTML='';
    const entries=await api.get('/api/funded-board');
    const total=entries.reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
    totalAmt.textContent=fmt$(total);
    const pct=Math.floor(100/repList.length);
    repList.forEach(rep=>{
      const repEntries=entries.filter(e=>(e.display_name||e.username)===rep);
      const repTotal=repEntries.reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
      const col=div({style:{flex:'1 0 '+pct+'%',minWidth:'0',display:'flex',flexDirection:'column'}});
      const hdr=div({style:{background:brand(),color:'#fff',borderRadius:'8px 8px 0 0',padding:'10px 12px',textAlign:'center'}});
      hdr.appendChild(div({style:{fontWeight:'700',fontSize:'13px',marginBottom:'1px'}},rep));
      hdr.appendChild(div({style:{fontSize:'12px',opacity:'.85'}},fmt$(repTotal)+' · '+repEntries.length+' deal'+(repEntries.length!==1?'s':'')));
      col.appendChild(hdr);
      const entries2=div({style:{background:'#fff',border:'1.5px solid #e5e7eb',borderTop:'none',minHeight:'80px'}});
      repEntries.forEach(e=>{
        const row=div({style:{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'7px 10px',borderBottom:'1px solid #f3f4f6',fontSize:'12px',gap:'6px'}});
        const lft=div({style:{flex:'1',minWidth:'0'}});
        lft.appendChild(div({style:{fontWeight:'700',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},fmt$(e.amount)));
        lft.appendChild(div({style:{fontSize:'11px',color:'#9ca3af',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},e.funder_name));
        row.appendChild(lft);
        const canDel=isEditing()||e.user_id===currentUser.id;
        if(canDel){const x=btn({style:{border:'none',background:'none',cursor:'pointer',color:'#d1d5db',fontSize:'16px',padding:'0',flexShrink:'0',fontFamily:'inherit'}},'×');x.onclick=async()=>{await api.del('/api/funded-board/'+e.id);loadBoard();};row.appendChild(x);}
        entries2.appendChild(row);
      });
      col.appendChild(entries2);
      const isMine=(currentUser.display_name||currentUser.username)===rep||isAdmin;
      if(isMine){
        const addBox=div({style:{background:'#f9fafb',border:'1.5px solid #e5e7eb',borderTop:'none',borderRadius:'0 0 8px 8px',padding:'8px'}});
        const amtI=inp({type:'number',step:'0.01',placeholder:'Amount ($)',style:{padding:'6px 8px',width:'100%',marginBottom:'5px',fontSize:'12px'}});
        const funI=inp({placeholder:'Funder',style:{padding:'6px 8px',width:'100%',marginBottom:'5px',fontSize:'12px'}});
        const addB=btn({className:'btn btn-primary',style:{width:'100%',justifyContent:'center',padding:'5px',fontSize:'12px'}},'+ Add');
        const errTxt=div({style:{fontSize:'11px',color:'#dc2626',marginTop:'3px'}});
        addB.onclick=async()=>{if(!amtI.value||!funI.value.trim()){errTxt.textContent='Fill both fields.';return;}const r=await api.post('/api/funded-board',{amount:parseFloat(amtI.value),funder_name:funI.value.trim(),rep_name:rep});if(r.ok){amtI.value='';funI.value='';errTxt.textContent='';loadBoard();}else errTxt.textContent=r.error||'Error';};
        addBox.appendChild(amtI);addBox.appendChild(funI);addBox.appendChild(addB);addBox.appendChild(errTxt);col.appendChild(addBox);
      } else {
        col.appendChild(div({style:{background:'#f9fafb',border:'1.5px solid #e5e7eb',borderTop:'none',borderRadius:'0 0 8px 8px',height:'8px'}}));
      }
      boardGrid.appendChild(col);
    });
  }
  loadBoard();
}

  const mkCard=(p)=>div({className:'card',style:{padding:'20px',marginBottom:'14px',parent:p}});
  const mkLabel=(t)=>div({style:{fontSize:'12px',fontWeight:'600',color:'#374151',marginBottom:'6px'}},t);
  const mkHint=(t)=>div({style:{fontSize:'11px',color:'#9ca3af',marginBottom:'10px'}},t);
  const mkResult=(panel)=>{
    const box=div({style:{background:'#f0f7ff',border:'1.5px solid #cce0ff',borderRadius:'10px',padding:'16px',fontSize:'13px',lineHeight:'1.8',whiteSpace:'pre-wrap',marginTop:'14px',display:'none'}});

  {

    ['Professional','Casual & Friendly','Urgent','Follow-Up'].forEach(v=>tone.appendChild(opt(v,v)));

Owner: ${ownerName.value||'there'}

    const channel=sel({style:{padding:'9px 11px',width:'100%'}});
    ['SMS','Email'].forEach(v=>channel.appendChild(opt(v,v)));

Business: ${bizName.value||'a business'}
Last contact: ${lastContact.value}
Last action: ${lastAction.value||'initial outreach'}

  container.appendChild(wrap);
}

// ── ADMIN ─────────────────────────────────────────────────────────────────────
async function renderAdmin(container){
  container.innerHTML='';
  const wrap=div({className:'page'});
  wrap.appendChild(div({className:'page-title'},'⚙️ Admin Panel'));
  const settingsLink=btn({className:'btn btn-ghost btn-sm',style:{marginBottom:'16px'}});settingsLink.textContent='Settings';settingsLink.onclick=()=>openSettings();wrap.appendChild(settingsLink);
  const tg=div({className:'tg',style:{marginBottom:'20px',flexWrap:'wrap'}});
  const sections={users:div({style:{display:'block'}}),teams:div({style:{display:'none'}}),reps:div({style:{display:'none'}})};
  let activeTab='users';
  ['users','teams','reps'].forEach(id=>{
    const b=btn({className:'tg-btn'+(id==='users'?' on':'')},id.charAt(0).toUpperCase()+id.slice(1));
    b.onclick=()=>{activeTab=id;tg.querySelectorAll('button').forEach(x=>x.className='tog-btn');b.className='tg-btn on';Object.entries(sections).forEach(([k,v])=>v.style.display=k===id?'block':'none');if(id==='users')loadUsers();if(id==='teams'){populateTeamReps();loadTeams();}};
    tg.appendChild(b);
  });
  wrap.appendChild(tg);Object.values(sections).forEach(s=>wrap.appendChild(s));container.appendChild(wrap);

  // ── Users ──
  const uSec=sections['users'];
  const uAddCard=div({className:'card',style:{padding:'20px',marginBottom:'14px'}});
  uAddCard.appendChild(div({style:{fontWeight:'700',marginBottom:'4px'}},'Add New User'));
  uAddCard.appendChild(div({style:{fontSize:'12px',color:'#9ca3af',marginBottom:'12px'}},'New users will be required to set their own password on first login.'));
  const uf={username:'',password:'',display_name:'',role:'user'};
  const uRow=div({style:{display:'flex',gap:'10px',flexWrap:'wrap',marginBottom:'10px'}});
  const uni=inp({type:'text',placeholder:'Username',style:{flex:'1 1 180px',padding:'8px 10px'}});uni.oninput=e=>uf.username=e.target.value.trim();
  const udni=inp({placeholder:'Display Name',style:{flex:'1 1 130px',padding:'8px 10px'}});udni.oninput=e=>uf.display_name=e.target.value;
  const upwW=pwWrap('new-user-pw','Password');upwW.style.flex='1 1 130px';
  const roleSel=sel({style:{flex:'1 1 100px',padding:'8px 10px'}});[['user','Rep'],['team_leader','Team Leader'],['admin','Admin']].forEach(([v,l])=>roleSel.appendChild(opt(v,l)));roleSel.onchange=e=>uf.role=e.target.value;
  const ucb=btn({className:'btn btn-primary btn-sm'},'Add User');
  uRow.appendChild(uni);uRow.appendChild(udni);uRow.appendChild(upwW);uRow.appendChild(roleSel);uRow.appendChild(ucb);
  const uMsg=div({style:{fontSize:'12px',marginTop:'4px'}});uAddCard.appendChild(uRow);uAddCard.appendChild(uMsg);uSec.appendChild(uAddCard);
  ucb.onclick=async()=>{
    uf.password=$('new-user-pw')?.value||'';
    if(!uf.username.trim()){uMsg.textContent='Username is required.';uMsg.style.color='#dc2626';return;}
    if(!uf.password){uMsg.textContent='Password is required.';uMsg.style.color='#dc2626';return;}
    ucb.disabled=true;ucb.textContent='Adding…';
    const r=await api.post('/api/users',{username:uf.username.trim(),password:uf.password,display_name:uf.display_name,role:uf.role});
    ucb.disabled=false;ucb.textContent='Add User';
    uMsg.textContent=r.error||'User created!';uMsg.style.color=r.error?'#dc2626':'#16a34a';
    if(!r.error){uni.value='';udni.value='';$('new-user-pw').value='';uf.username='';uf.password='';uf.display_name='';loadUsers();}
  };
  const uList=div({});uSec.appendChild(uList);

  async function loadUsers(){
    uList.innerHTML='';
    const users=await api.get('/api/users');
    users.forEach(u=>{
      const card=div({className:'card',style:{marginBottom:'8px',overflow:'hidden'}});
      const row=div({style:{padding:'11px 14px',display:'flex',alignItems:'center',justifyContent:'space-between',gap:'10px',flexWrap:'wrap'}});
      const info=div({style:{flex:'1'}});
      info.appendChild(div({style:{fontWeight:'700',fontSize:'13px'}},u.display_name||u.username,' ',span({style:{fontSize:'11px',color:'#9ca3af'}},'@'+u.username)));
      info.appendChild(div({style:{fontSize:'12px',color:'#9ca3af',marginTop:'2px'}},u.role));
      const bs=div({style:{display:'flex',gap:'6px'}});
      const eb=btn({className:'btn btn-ghost btn-sm'},'Edit');
      if(u.role!=='superadmin'){const db=btn({className:'btn btn-ghost btn-sm',style:{color:'#dc2626',borderColor:'#fca5a5'}},'Delete');db.onclick=async()=>{if(!confirm('Delete '+u.username+'?'))return;await api.del('/api/users/'+u.id);loadUsers();};bs.appendChild(db);}
      bs.appendChild(eb);row.appendChild(info);row.appendChild(bs);card.appendChild(row);
      const ef=div({style:{display:'none',borderTop:'1px solid #e5e7eb',padding:'16px',background:'#f9fafb'}});
      const efg=div({style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px',marginBottom:'12px'}});
      const efFld=(lbl,i)=>{const f=div({});f.appendChild(div({style:{fontSize:'12px',fontWeight:'600',color:'#374151',marginBottom:'5px'}},lbl));f.appendChild(i);return f;};
      const eDni=inp({style:{padding:'8px 10px',width:'100%'}});eDni.value=u.display_name||'';
      const eRSel=sel({style:{padding:'8px 10px',width:'100%'}});[['user','Rep'],['team_leader','Team Leader'],['admin','Admin']].forEach(([v,l])=>eRSel.appendChild(opt(v,l,u.role===v)));
      const ePwW=pwWrap('epw-'+u.id,'New password (optional)');
      efg.appendChild(efFld('Display Name',eDni));efg.appendChild(efFld('Role',eRSel));ef.appendChild(efg);ef.appendChild(efFld('Password',ePwW));
      // Email section
      ef.appendChild(div({style:{fontSize:'11px',fontWeight:'700',color:'#6b7280',textTransform:'uppercase',marginTop:'14px',marginBottom:'8px'}},'Send Email'));
      const eEmailI=inp({type:'email',placeholder:'rep@gmail.com',style:{padding:'8px 10px',width:'100%',marginBottom:'8px'}});eEmailI.value=u.personal_email||'';
      const eEmailStatus=div({style:{fontSize:'11px',padding:'6px 10px',borderRadius:'6px',marginBottom:'8px',background:u.personal_email?'#f0fdf4':'#fff7ed',color:u.personal_email?'#065f46':'#92400e'}});
      eEmailStatus.textContent=u.personal_email?`✅ Email connected: ${u.personal_email}`:'⚠️ No email set — will use company master email';
      ef.appendChild(eEmailStatus);ef.appendChild(efFld('Gmail Address',eEmailI));
      const eEmailPw=pwWrap('epw-email-'+u.id,'Gmail App Password');
      ef.appendChild(efFld('App Password',eEmailPw));
      // Tab access
      ef.appendChild(div({style:{fontSize:'11px',fontWeight:'700',color:'#6b7280',textTransform:'uppercase',marginTop:'12px',marginBottom:'8px'}},'Tab Access'));
      const tabAccess=new Set(JSON.parse(u.tab_access||'[]'));
      const pills=div({style:{display:'flex',flexWrap:'wrap',gap:'6px',marginBottom:'12px'}});
      TABS_ALL.forEach(t=>{
        const isOn=tabAccess.has(t);
        const p=btn({style:{padding:'5px 12px',borderRadius:'20px',border:'1.5px solid',fontSize:'12px',fontWeight:'600',cursor:'pointer',fontFamily:'inherit',background:isOn?brand():'#fff',color:isOn?'#fff':'#9ca3af',borderColor:isOn?brand():'#d1d5db'}},TAB_LABELS[t]||t);
        p.onclick=async()=>{if(tabAccess.has(t))tabAccess.delete(t);else tabAccess.add(t);const on=tabAccess.has(t);p.style.background=on?brand():'#fff';p.style.color=on?'#fff':'#9ca3af';p.style.borderColor=on?brand():'#d1d5db';await api.put('/api/users/'+u.id,{tab_access:JSON.stringify([...tabAccess])});};
        pills.appendChild(p);
      });
      ef.appendChild(pills);
      const eSv=btn({className:'btn btn-primary btn-sm'},'Save');const eCn=btn({className:'btn btn-ghost btn-sm'},'Cancel');
      eSv.onclick=async()=>{
        const pw=$('epw-'+u.id)?.value;
        const emailPw=$('epw-email-'+u.id)?.value;
        const payload={display_name:eDni.value,role:eRSel.value,personal_email:eEmailI.value};
        if(pw)payload.password=pw;
        if(emailPw)payload.personal_email_pass=emailPw;
        const r=await api.put('/api/users/'+u.id,payload);
        if(r.ok){
          eEmailStatus.textContent=eEmailI.value?`✅ Email connected: ${eEmailI.value}`:'⚠️ No email set — will use company master email';
          eEmailStatus.style.background=eEmailI.value?'#f0fdf4':'#fff7ed';eEmailStatus.style.color=eEmailI.value?'#065f46':'#92400e';
          ef.style.display='none';loadUsers();
        }else alert(r.error);
      };
      eCn.onclick=()=>ef.style.display='none';
      const eBtns=div({style:{display:'flex',gap:'8px'}});eBtns.appendChild(eSv);eBtns.appendChild(eCn);ef.appendChild(eBtns);
      card.appendChild(ef);eb.onclick=()=>ef.style.display=ef.style.display==='none'?'block':'none';
      uList.appendChild(card);
    });
  }
  loadUsers();

  // ── Teams ──
  const teamSec=sections['teams'];
  teamSec.appendChild(div({style:{fontSize:'13px',color:'#6b7280',marginBottom:'14px'}},'Set up teams. Team leaders can see their members\' deals.'));
  const tAddCard=div({className:'card',style:{padding:'20px',marginBottom:'14px'}});
  tAddCard.appendChild(div({style:{fontWeight:'700',marginBottom:'12px'}},'Create Team'));
  const tState={name:'',leader:'',members:[]};
  const tni=inp({placeholder:'Team name',style:{padding:'8px 10px',width:'100%',marginBottom:'10px'}});tni.oninput=e=>tState.name=e.target.value;tAddCard.appendChild(tni);
  tAddCard.appendChild(div({style:{fontSize:'11px',fontWeight:'700',color:'#6b7280',textTransform:'uppercase',marginBottom:'6px'}},'Leader'));
  const tLdrSel=sel({style:{padding:'8px 10px',width:'100%',marginBottom:'10px'}});tAddCard.appendChild(tLdrSel);
  tAddCard.appendChild(div({style:{fontSize:'11px',fontWeight:'700',color:'#6b7280',textTransform:'uppercase',marginBottom:'6px'}},'Members'));
  const tMemberGrid=div({style:{display:'flex',flexWrap:'wrap',gap:'8px',marginBottom:'10px'}});tAddCard.appendChild(tMemberGrid);
  const tMsg=div({style:{fontSize:'12px',marginBottom:'8px'}});tAddCard.appendChild(tMsg);
  const tcb=btn({className:'btn btn-primary btn-sm'},'Create Team');tAddCard.appendChild(tcb);
  teamSec.appendChild(tAddCard);
  const tList=div({});teamSec.appendChild(tList);
  let cachedReps=[];

  async function populateTeamReps(){
    const co2=await api.get('/api/company');
    cachedReps=JSON.parse(co2.rep_list||'[]');
    tLdrSel.innerHTML='';tLdrSel.appendChild(opt('','No leader'));
    cachedReps.forEach(r=>tLdrSel.appendChild(opt(r,r)));
    tLdrSel.onchange=e=>{tState.leader=e.target.value;rebuildMemberGrid(tMemberGrid,tState.members,cachedReps,tState.leader,tState.members);};
    rebuildMemberGrid(tMemberGrid,tState.members,cachedReps,tState.leader,tState.members);
  }

  function rebuildMemberGrid(grid,memberArr,reps,leader,arr){
    grid.innerHTML='';
    reps.filter(r=>r!==leader).forEach(r=>{
      const lbl=el('label',{style:{display:'flex',alignItems:'center',gap:'6px',fontSize:'13px',cursor:'pointer',padding:'6px 10px',background:'#fff',border:'1.5px solid #e5e7eb',borderRadius:'6px'}});
      const chk=inp({type:'checkbox'});chk.checked=arr.includes(r);
      chk.onchange=e=>{if(e.target.checked){if(!arr.includes(r))arr.push(r);}else{const i=arr.indexOf(r);if(i>-1)arr.splice(i,1);}};
      lbl.appendChild(chk);lbl.appendChild(document.createTextNode(r));grid.appendChild(lbl);
    });
    if(leader)grid.appendChild(div({style:{fontSize:'11px',color:'#9ca3af',width:'100%',marginTop:'2px'}},'* '+leader+' auto-included as leader'));
  }

  tcb.onclick=async()=>{
    if(!tState.name.trim()){tMsg.textContent='Name required.';tMsg.style.color='#dc2626';return;}
    const r=await api.post('/api/teams',{name:tState.name,leader_name:tState.leader,member_names:tState.members});
    tMsg.textContent=r.error||'Team created!';tMsg.style.color=r.error?'#dc2626':'#16a34a';
    if(!r.ok)return;tni.value='';tState.name='';tState.leader='';tState.members=[];tLdrSel.value='';
    tMemberGrid.querySelectorAll('input[type=checkbox]').forEach(c=>c.checked=false);loadTeams();
  };

  async function loadTeams(){
    tList.innerHTML='';
    const teams=await api.get('/api/teams');
    if(!teams.length){tList.appendChild(div({style:{color:'#9ca3af',fontSize:'13px'}},'No teams yet.'));return;}
    teams.forEach(team=>{
      const mn=team.member_names||[];
      const card=div({className:'card',style:{marginBottom:'8px',overflow:'hidden'}});
      const row=div({style:{padding:'11px 14px',display:'flex',alignItems:'center',justifyContent:'space-between',gap:'10px'}});
      const info=div({style:{flex:'1'}});
      info.appendChild(div({style:{fontWeight:'700',fontSize:'13px'}},team.name));
      info.appendChild(div({style:{fontSize:'12px',color:'#9ca3af',marginTop:'2px'}},'Leader: '+(team.leader_name||'None')+' · Members: '+(mn.length?mn.join(', '):'None')));
      const bs=div({style:{display:'flex',gap:'6px'}});
      const eb=btn({className:'btn btn-ghost btn-sm'},'Edit');
      const db=btn({className:'btn btn-ghost btn-sm',style:{color:'#dc2626',borderColor:'#fca5a5'}},'Delete');
      db.onclick=async()=>{if(!confirm('Delete?'))return;await api.del('/api/teams/'+team.id);loadTeams();};
      bs.appendChild(eb);bs.appendChild(db);row.appendChild(info);row.appendChild(bs);card.appendChild(row);
      const ef=div({style:{display:'none',borderTop:'1px solid #e5e7eb',padding:'14px',background:'#f9fafb'}});
      const eState={name:team.name,leader:team.leader_name||'',members:[...mn]};
      const eNameI=inp({style:{padding:'8px 10px',width:'100%',marginBottom:'10px'}});eNameI.value=eState.name;eNameI.oninput=e=>eState.name=e.target.value;ef.appendChild(eNameI);
      ef.appendChild(div({style:{fontSize:'11px',fontWeight:'700',color:'#6b7280',textTransform:'uppercase',marginBottom:'6px'}},'Leader'));
      const eLdr=sel({style:{padding:'8px 10px',width:'100%',marginBottom:'10px'}});eLdr.appendChild(opt('','No leader'));cachedReps.forEach(r=>eLdr.appendChild(opt(r,r,r===eState.leader)));
      const eMGrid=div({style:{display:'flex',flexWrap:'wrap',gap:'8px',marginBottom:'10px'}});
      eLdr.onchange=e=>{eState.leader=e.target.value;eState.members=eState.members.filter(m=>m!==e.target.value);rebuildMemberGrid(eMGrid,eState.members,cachedReps,eState.leader,eState.members);};
      ef.appendChild(eLdr);ef.appendChild(div({style:{fontSize:'11px',fontWeight:'700',color:'#6b7280',textTransform:'uppercase',marginBottom:'6px'}},'Members'));
      rebuildMemberGrid(eMGrid,eState.members,cachedReps,eState.leader,eState.members);ef.appendChild(eMGrid);
      const eSv=btn({className:'btn btn-primary btn-sm'},'Save');const eCn=btn({className:'btn btn-ghost btn-sm'},'Cancel');
      eSv.onclick=async()=>{await api.put('/api/teams/'+team.id,{name:eState.name,leader_name:eState.leader,member_names:eState.members});ef.style.display='none';loadTeams();};
      eCn.onclick=()=>ef.style.display='none';
      const eBtns=div({style:{display:'flex',gap:'8px'}});eBtns.appendChild(eSv);eBtns.appendChild(eCn);ef.appendChild(eBtns);
      card.appendChild(ef);eb.onclick=()=>ef.style.display=ef.style.display==='none'?'block':'none';tList.appendChild(card);
    });
  }

  // ── Reps ──
  const repSec=sections['reps'];
  repSec.appendChild(div({style:{fontSize:'13px',color:'#6b7280',marginBottom:'14px'}},'Manage the rep names used in deals and the funded board.'));
  const repCard=div({className:'card',style:{padding:'20px'}});
  const repInput=inp({placeholder:'Rep name',style:{padding:'8px 10px',marginRight:'8px',width:'200px'}});
  const repAddBtn=btn({className:'btn btn-primary btn-sm'},'Add Rep');
  const repRow=div({style:{display:'flex',gap:'8px',marginBottom:'14px',alignItems:'center'}});repRow.appendChild(repInput);repRow.appendChild(repAddBtn);repCard.appendChild(repRow);
  const repList2=div({});repCard.appendChild(repList2);repSec.appendChild(repCard);
  async function loadReps(){
    const co2=await api.get('/api/company');
    const reps=JSON.parse(co2.rep_list||'[]');
    repList2.innerHTML='';
    if(!reps.length){repList2.appendChild(div({style:{color:'#9ca3af',fontSize:'13px'}},'No reps yet.'));return;}
    reps.forEach((r,i)=>{
      const row=div({style:{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'8px 0',borderBottom:'1px solid #f3f4f6'}});
      row.appendChild(span({style:{fontWeight:'600',fontSize:'13px'}},r));
      const x=btn({style:{border:'none',background:'none',cursor:'pointer',color:'#9ca3af',fontSize:'18px',fontFamily:'inherit'}},'×');
      x.onclick=async()=>{reps.splice(i,1);await api.put('/api/company',{rep_list:JSON.stringify(reps)});loadReps();};
      row.appendChild(x);repList2.appendChild(row);
    });
  }
  const doAddRep=async()=>{
    const name=repInput.value.trim();if(!name)return;
    const co2=await api.get('/api/company');const reps=JSON.parse(co2.rep_list||'[]');
    if(reps.includes(name))return;reps.push(name);await api.put('/api/company',{rep_list:JSON.stringify(reps)});
    repInput.value='';loadReps();
  };
  repAddBtn.onclick=doAddRep;
  repInput.onkeydown=e=>{if(e.key==='Enter')doAddRep();};
  loadReps();
}

// ── SUPER ADMIN ───────────────────────────────────────────────────────────────
async function renderSuperAdmin(container){
  container.innerHTML='';
  const wrap=div({className:'page'});
  wrap.appendChild(div({className:'page-title'},'🌐 Company Management'));
  wrap.appendChild(div({className:'page-sub'},'Create and manage all client companies. You cannot access their deal data.'));

  // Add company
  const addCard=div({className:'card',style:{padding:'20px',marginBottom:'20px'}});
  addCard.appendChild(div({style:{fontWeight:'700',fontSize:'14px',marginBottom:'14px'}},'Add New Company'));
  const ag=div({style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px',marginBottom:'10px'}});
  const afld=(lbl,i)=>{const f=div({});f.appendChild(div({style:{fontSize:'12px',fontWeight:'600',color:'#374151',marginBottom:'5px'}},lbl));f.appendChild(i);return f;};
  const ani=inp({placeholder:'Company name *',style:{padding:'9px 11px',width:'100%'}});
  const ati=inp({placeholder:'Tagline',style:{padding:'9px 11px',width:'100%'}});
  const aci=inp({type:'color',style:{height:'40px',width:'60px',padding:'2px 4px',borderRadius:'6px',cursor:'pointer'}});aci.value='#111111';
  const aui=inp({placeholder:'Admin username *',style:{padding:'9px 11px',width:'100%'}});
  const apwW=pwWrap('new-co-pw','Admin password *');
  ag.appendChild(afld('Company Name',ani));ag.appendChild(afld('Tagline',ati));ag.appendChild(afld('Brand Color',aci));ag.appendChild(afld('Admin Username',aui));ag.appendChild(afld('Admin Password',apwW));
  addCard.appendChild(ag);
  const aMsg=div({style:{fontSize:'12px',marginTop:'8px',marginBottom:'8px',display:'none'}});addCard.appendChild(aMsg);
  const aCb=btn({className:'btn btn-primary'},'Create Company');
  aCb.onclick=async()=>{
    const pw=$('new-co-pw')?.value;
    if(!ani.value.trim()||!aui.value.trim()||!pw){aMsg.textContent='Name, admin username and password required.';aMsg.style.display='block';aMsg.style.color='#dc2626';return;}
    if(!aui.value.includes('@')){aMsg.textContent='Admin username must be a valid email address.';aMsg.style.display='block';aMsg.style.color='#dc2626';return;}
    aCb.textContent='Creating…';aCb.disabled=true;
    const r=await api.post('/api/superadmin/companies',{name:ani.value.trim(),tagline:ati.value,color:aci.value,admin_username:aui.value.trim(),admin_password:pw});
    aCb.textContent='Create Company';aCb.disabled=false;aMsg.style.display='block';
    if(r.ok){aMsg.textContent='✓ Company created! Login: '+aui.value;aMsg.style.color='#065f46';ani.value='';ati.value='';aui.value='';$('new-co-pw').value='';loadCompanies();}
    else{aMsg.textContent=r.error||'Error';aMsg.style.color='#dc2626';}
  };
  addCard.appendChild(aCb);wrap.appendChild(addCard);
  const coList=div({});wrap.appendChild(coList);container.appendChild(wrap);

  async function loadCompanies(){
    coList.innerHTML='';
    const companies=await api.get('/api/superadmin/companies');
    companies.filter(c=>c.id!==1).forEach(co=>{
      const card=div({className:'card',style:{marginBottom:'10px',overflow:'hidden'}});
      const row=div({style:{padding:'14px 18px',display:'flex',alignItems:'center',justifyContent:'space-between',gap:'12px',flexWrap:'wrap'}});
      const sq=div({style:{width:'36px',height:'36px',borderRadius:'8px',background:co.color||'#111',display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontWeight:'800',fontSize:'14px',flexShrink:'0'}},co.name.charAt(0));
      const info=div({style:{flex:'1'}});
      info.appendChild(div({style:{fontWeight:'700',fontSize:'14px'}},co.name));
      info.appendChild(div({style:{fontSize:'12px',color:'#9ca3af'}},co.tagline||'No tagline · ID: '+co.id));
      const bs=div({style:{display:'flex',gap:'6px'}});
      const eb=btn({className:'btn btn-ghost btn-sm'},'Edit');
      const db=btn({className:'btn btn-ghost btn-sm',style:{color:'#dc2626',borderColor:'#fca5a5'}},'Delete');
      db.onclick=async()=>{if(!confirm('Delete '+co.name+' and ALL its data?'))return;const r=await api.del('/api/superadmin/companies/'+co.id);if(r.ok)loadCompanies();else alert(r.error);};
      bs.appendChild(eb);bs.appendChild(db);
      row.appendChild(sq);row.appendChild(info);row.appendChild(bs);card.appendChild(row);
      const ef=div({style:{display:'none',borderTop:'1px solid #e5e7eb',padding:'18px',background:'#f9fafb'}});
      ef.appendChild(div({style:{fontWeight:'700',fontSize:'13px',marginBottom:'14px'}},'Edit: '+co.name));
      const eg=div({style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px',marginBottom:'14px'}});
      const efld=(lbl,i)=>{const f=div({});f.appendChild(div({style:{fontSize:'12px',fontWeight:'600',color:'#374151',marginBottom:'5px'}},lbl));f.appendChild(i);return f;};
      const eni=inp({style:{padding:'9px 11px',width:'100%'}});eni.value=co.name;
      const eti=inp({style:{padding:'9px 11px',width:'100%'}});eti.value=co.tagline||'';
      const eci=inp({type:'color',style:{height:'40px',width:'60px',padding:'2px 4px',borderRadius:'6px',cursor:'pointer'}});eci.value=co.color||'#111111';
      const eei=inp({type:'email',style:{padding:'9px 11px',width:'100%'}});eei.value=co.master_email||'';
      const epwW2=pwWrap('epw-co-'+co.id,'Master Email App Password');
      eg.appendChild(efld('Name',eni));eg.appendChild(efld('Tagline',eti));eg.appendChild(efld('Brand Color',eci));eg.appendChild(efld('Master Email',eei));eg.appendChild(efld('Email Password',epwW2));
      ef.appendChild(eg);
      // Master funders toggle
      const mfDiv=div({style:{marginBottom:'14px',paddingBottom:'14px',borderBottom:'1px solid #e5e7eb'}});
      mfDiv.appendChild(div({style:{fontSize:'12px',fontWeight:'700',color:'#374151',marginBottom:'8px'}},'Funder Sheet Access'));
      // 3-mode funder sheet selector
      let mfMode = co.funder_mode || (co.use_master_funders ? 'master' : 'custom');
      const mfOpts=[
        {value:'master',  label:'📋 Master Sheet',   desc:'Uses your master funder list. Cannot customize.',          color:'#2563eb'},
        {value:'template',label:'📄 Master as Template',desc:'Started from master, can customize their own copy.',     color:'#7c3aed'},
        {value:'custom',  label:'🔒 Custom Only',    desc:'Fully independent funder list. No master access.',          color:'#dc2626'},
      ];
      const mfRow=div({style:{display:'flex',gap:'6px',flexWrap:'wrap'}});
      const mfBtns={};
      const updateMfBtns=()=>{
        mfOpts.forEach(o=>{
          const b=mfBtns[o.value];
          const active=mfMode===o.value;
          b.style.background=active?o.color:'#fff';
          b.style.color=active?'#fff':'#555';
          b.style.borderColor=active?o.color:'#d1d5db';
        });
      };
      mfOpts.forEach(o=>{
        const b=btn({style:{flex:'1',minWidth:'120px',padding:'8px 6px',border:'1.5px solid',borderRadius:'6px',cursor:'pointer',fontFamily:'inherit',fontSize:'11px',fontWeight:'600',transition:'all .15s'}},o.label);
        b.onclick=()=>{mfMode=o.value;updateMfBtns();};
        mfBtns[o.value]=b;
        mfRow.appendChild(b);
      });
      updateMfBtns();
      mfDiv.appendChild(mfRow);
      const mfDesc=div({style:{fontSize:'11px',color:'#9ca3af',marginTop:'6px'}});
      const updateMfDesc=()=>{mfDesc.textContent=mfOpts.find(o=>o.value===mfMode)?.desc||'';};
      updateMfDesc();
      mfOpts.forEach(o=>{mfBtns[o.value].addEventListener('click',updateMfDesc);});
      mfDiv.appendChild(mfDesc);
      ef.appendChild(mfDiv);
      // Module access toggles
      const modDiv=div({style:{marginBottom:'14px',paddingBottom:'14px',borderBottom:'1px solid #e5e7eb'}});
      modDiv.appendChild(div({style:{fontSize:'12px',fontWeight:'700',color:'#374151',marginBottom:'4px'}},'Module Access'));
      modDiv.appendChild(div({style:{fontSize:'11px',color:'#9ca3af',marginBottom:'10px'}},'Choose which tabs/features this company can access.'));
      const modAccess=new Set(JSON.parse(co.module_access||'["shop","dir","calc","submit","active","submissions","funded","info","msg"]'));
      const modLabels={shop:'🛒 Shopping',dir:'📋 Directory',calc:'🧮 Calculator',submit:'📤 Submit Deal',active:'Active Deals',submissions:'Submissions',info:'Info',board:'Board',msg:'MessageIQ'};
      const modGrid=div({style:{display:'flex',flexWrap:'wrap',gap:'6px'}});
      TABS_ALL.forEach(t=>{
        const on=modAccess.has(t);
        const p=btn({style:{padding:'6px 12px',border:'1.5px solid',borderRadius:'6px',fontSize:'12px',fontWeight:'600',cursor:'pointer',fontFamily:'inherit',background:on?brand():'#fff',color:on?'#fff':'#9ca3af',borderColor:on?brand():'#d1d5db',transition:'all .12s'}},modLabels[t]||t);
        p.onclick=()=>{if(modAccess.has(t))modAccess.delete(t);else modAccess.add(t);const isOn=modAccess.has(t);p.style.background=isOn?brand():'#fff';p.style.color=isOn?'#fff':'#9ca3af';p.style.borderColor=isOn?brand():'#d1d5db';};
        modGrid.appendChild(p);
      });
      modDiv.appendChild(modGrid);ef.appendChild(modDiv);
      // Users for this company
      ef.appendChild(div({style:{fontWeight:'700',fontSize:'13px',marginBottom:'10px',paddingTop:'10px',borderTop:'1px solid #e5e7eb'}},'Users'));
      const uListDiv=div({});ef.appendChild(uListDiv);
      const uMsgDiv=div({style:{fontSize:'12px',marginBottom:'8px'}});ef.appendChild(uMsgDiv);
      // Add user to company form
      const addUserRow=div({style:{display:'flex',gap:'8px',marginBottom:'10px',flexWrap:'wrap'}});
      const auName=inp({placeholder:'Email (username)',style:{flex:'1 1 140px',padding:'7px 10px',fontSize:'12px'}});
      const auDisp=inp({placeholder:'Display Name',style:{flex:'1 1 100px',padding:'7px 10px',fontSize:'12px'}});
      const auPw=inp({type:'password',placeholder:'Password',style:{flex:'1 1 100px',padding:'7px 10px',fontSize:'12px'}});
      const auRole=sel({style:{padding:'7px 10px',fontSize:'12px'}});[['user','Rep'],['team_leader','Team Leader'],['admin','Admin']].forEach(([v,l])=>auRole.appendChild(opt(v,l)));
      const auBtn=btn({className:'btn btn-primary btn-sm',style:{whiteSpace:'nowrap'}},'+ Add User');
      auBtn.onclick=async()=>{
        if(!auName.value.trim()||!auPw.value){uMsgDiv.textContent='Username and password required.';uMsgDiv.style.color='#dc2626';return;}
        const r2=await api.post('/api/superadmin/companies/'+co.id+'/users',{username:auName.value.trim(),password:auPw.value,display_name:auDisp.value,role:auRole.value});
        if(r2.ok){uMsgDiv.textContent='✅ User added!';uMsgDiv.style.color='#065f46';auName.value='';auDisp.value='';auPw.value='';loadUserList();}
        else{uMsgDiv.textContent=r2.error||'Error';uMsgDiv.style.color='#dc2626';}
      };
      addUserRow.appendChild(auName);addUserRow.appendChild(auDisp);addUserRow.appendChild(auPw);addUserRow.appendChild(auRole);addUserRow.appendChild(auBtn);
      ef.appendChild(addUserRow);ef.appendChild(uMsgDiv);
      function loadUserList(){
        uListDiv.innerHTML='';
        api.get('/api/superadmin/companies/'+co.id+'/users').then(users=>{
          if(!users.length){uListDiv.appendChild(div({style:{fontSize:'12px',color:'#9ca3af',paddingBottom:'8px'}},'No users yet.'));return;}
          users.forEach(u=>{
            const ur=div({style:{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'7px 0',borderBottom:'1px solid #f3f4f6',fontSize:'13px'}});
            ur.appendChild(span({style:{fontWeight:'600'}},u.display_name||u.username,' ',span({style:{color:'#9ca3af',fontWeight:'400'}},'('+u.role+')')));
            const rowBtns=div({style:{display:'flex',gap:'6px'}});
            const resetPw=btn({className:'btn btn-ghost btn-sm'},'Reset PW');
            resetPw.onclick=async()=>{const np=prompt('New password for '+u.username+':');if(!np)return;const r=await api.put('/api/superadmin/users/'+u.id,{password:np});resetPw.textContent=r.ok?'✓':'Error';setTimeout(()=>resetPw.textContent='Reset PW',2000);};
            rowBtns.appendChild(resetPw);
            if(u.role!=='superadmin'){
              const delU=btn({className:'btn btn-ghost btn-sm',style:{color:'#dc2626',borderColor:'#fca5a5'}},'Delete');
              delU.onclick=async()=>{if(!confirm('Delete '+u.username+'?'))return;const r=await api.del('/api/superadmin/users/'+u.id);if(r.ok)loadUserList();else alert(r.error);};
              rowBtns.appendChild(delU);
            }
            ur.appendChild(rowBtns);uListDiv.appendChild(ur);
          });
        });
      }
      loadUserList();
      const eSv=btn({className:'btn btn-primary btn-sm'},'Save');const eCn=btn({className:'btn btn-ghost btn-sm'},'Cancel');
      eSv.onclick=async()=>{
        const pw=$('epw-co-'+co.id)?.value;
        const payload={name:eni.value,tagline:eti.value,color:eci.value,master_email:eei.value,funder_mode:mfMode,module_access:JSON.stringify([...modAccess])};
        if(pw)payload.master_email_pass=pw;
        const r=await api.put('/api/superadmin/companies/'+co.id,payload);
        if(r.ok){ef.style.display='none';loadCompanies();}else alert(r.error);
      };
      eCn.onclick=()=>ef.style.display='none';
      const eBtns=div({style:{display:'flex',gap:'8px',marginTop:'14px'}});eBtns.appendChild(eSv);eBtns.appendChild(eCn);ef.appendChild(eBtns);
      card.appendChild(ef);eb.onclick=()=>ef.style.display=ef.style.display==='none'?'block':'none';
      coList.appendChild(card);
    });
  }
  loadCompanies();
}

window.addEventListener("DOMContentLoaded", () => {
  init().catch(e => {
    console.error("Init failed:", e);
    $('login-screen').style.display='flex';
  });
});
</script>
</body>
</html>
