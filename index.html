function getCommission(factor){
  if(!factor||factor<1.35)return null;
  for(let i=COMM_TABLE.length-1;i>=0;i--){if(factor>=COMM_TABLE[i].rate)return COMM_TABLE[i].pct;}
  return null;
}
function renderCalculator(container){
  container.innerHTML='';
  const wrap=div({className:'page',style:{maxWidth:'640px'}});
  wrap.appendChild(div({className:'page-title'},'🧮 Calculator'));

  // Tab bar
  const tabBar=div({style:{display:'flex',background:'#fff',border:'1px solid #e5e7eb',borderRadius:'10px',padding:'4px',marginBottom:'20px',gap:'3px'}});
  const fwdPanel=div({});
  const revPanel=div({style:{display:'none'}});
  const fwdBtn=btn({style:{flex:'1',padding:'9px',border:'none',borderRadius:'7px',cursor:'pointer',fontFamily:'inherit',fontSize:'13px',fontWeight:'600',background:brand(),color:'#fff'}},'Deal Calculator');
  const revBtn=btn({style:{flex:'1',padding:'9px',border:'none',borderRadius:'7px',cursor:'pointer',fontFamily:'inherit',fontSize:'13px',fontWeight:'600',background:'transparent',color:'#6b7280'}},'Reverse Calculator');
  fwdBtn.onclick=()=>{fwdPanel.style.display='block';revPanel.style.display='none';fwdBtn.style.background=brand();fwdBtn.style.color='#fff';revBtn.style.background='transparent';revBtn.style.color='#6b7280';};
  revBtn.onclick=()=>{fwdPanel.style.display='none';revPanel.style.display='block';revBtn.style.background=brand();revBtn.style.color='#fff';fwdBtn.style.background='transparent';fwdBtn.style.color='#6b7280';};
  tabBar.appendChild(fwdBtn);tabBar.appendChild(revBtn);
  wrap.appendChild(tabBar);

  // ── FORWARD CALCULATOR ───────────────────────────────────────────────────
  {
    let freqMode='daily';
    const fmt=n=>isNaN(n)||!isFinite(n)||!n?'—':'$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
    const inputCard=div({className:'card',style:{padding:'22px',marginBottom:'16px'}});
    const hdr=div({style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'20px'}});
    const hl=div({});
    hl.appendChild(div({style:{fontSize:'15px',fontWeight:'700',marginBottom:'3px'}},'Deal Calculator'));
    hl.appendChild(div({style:{fontSize:'12px',color:'#6b7280'}},'Fill in deal info — results update instantly'));
    const clrBtn=btn({className:'btn btn-ghost btn-sm'},'Clear');
    hdr.appendChild(hl);hdr.appendChild(clrBtn);inputCard.appendChild(hdr);
    const fld=(lbl,i)=>{const f=div({style:{marginBottom:'14px'}});f.appendChild(div({style:{fontSize:'12px',fontWeight:'600',color:'#374151',marginBottom:'5px'}},lbl));f.appendChild(i);return f;};
    const fi=inp({type:'number',placeholder:'e.g. 100000',style:{padding:'11px 13px',width:'100%'}});
    const fci=inp({type:'number',placeholder:'e.g. 1.45',step:'0.001',style:{padding:'11px 13px',width:'100%'}});
    const oi=inp({type:'number',placeholder:'e.g. 3',step:'0.1',min:'0',max:'100',style:{padding:'11px 13px',width:'100%'}});
    const pi=inp({type:'number',placeholder:'e.g. 100',style:{padding:'11px 13px',width:'100%'}});
    inputCard.appendChild(fld('Funding Amount ($)',fi));
    inputCard.appendChild(fld('Factor Rate',fci));
    inputCard.appendChild(fld('Origination Fee (%)',oi));
    inputCard.appendChild(fld('Number of Payments',pi));
    const freqRow=div({style:{display:'flex',gap:'8px',marginTop:'4px'}});
    [['daily','Daily'],['weekly','Weekly']].forEach(([mode,label])=>{
      const b=btn({style:{flex:'1',padding:'10px',border:'1.5px solid',borderRadius:'7px',cursor:'pointer',fontFamily:'inherit',fontSize:'13px',fontWeight:'600',transition:'all .12s',background:mode==='daily'?brand():'#fff',color:mode==='daily'?'#fff':'#6b7280',borderColor:mode==='daily'?brand():'#d1d5db'}},label);
      b.onclick=()=>{freqMode=mode;freqRow.querySelectorAll('button').forEach(x=>{x.style.background='#fff';x.style.color='#6b7280';x.style.borderColor='#d1d5db';});b.style.background=brand();b.style.color='#fff';b.style.borderColor=brand();recalc();};
      freqRow.appendChild(b);
    });
    const freqFld=div({style:{marginBottom:'0'}});
    freqFld.appendChild(div({style:{fontSize:'12px',fontWeight:'600',color:'#374151',marginBottom:'5px'}},'Payment Frequency'));
    freqFld.appendChild(freqRow);
    inputCard.appendChild(freqFld);
    clrBtn.onclick=()=>{fi.value='';fci.value='';oi.value='';pi.value='';recalc();};
    fwdPanel.appendChild(inputCard);

    // Results card
    const resCard=div({className:'card',style:{padding:'22px'}});
    const mkRow=(lbl,id,bold)=>{const r=div({style:{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'10px 0',borderBottom:'1px solid #f3f4f6'}});r.appendChild(div({style:{fontSize:'13px',color:'#6b7280'}},lbl));const v=div({id,style:{fontSize:bold?'18px':'15px',fontWeight:bold?'800':'600',color:bold?brand():'#111'}});r.appendChild(v);return r;};
    resCard.appendChild(mkRow('Payback Amount','fwd-payback'));
    resCard.appendChild(mkRow('Net Funded (after fee)','fwd-net'));
    resCard.appendChild(mkRow('Origination Fee','fwd-fee'));
    resCard.appendChild(mkRow('Payment Per Period','fwd-payment',true));
    resCard.appendChild(mkRow('Total Cost of Capital','fwd-cost'));
    resCard.appendChild(mkRow('Term Length','fwd-term'));
    fwdPanel.appendChild(resCard);

    function recalc(){
      const fund=parseFloat(fi.value)||0,fr=parseFloat(fci.value)||0,origPct=parseFloat(oi.value)||0,nPay=parseFloat(pi.value)||0;
      const payback=fund*fr;
      const fee=fund*(origPct/100);
      const net=fund-fee;
      const payment=nPay?payback/nPay:0;
      const termDays=freqMode==='daily'?nPay:nPay*7;
      const termStr=termDays>=7?Math.round(termDays/7)+' weeks ('+(termDays)+' days)':termDays+' days';
      ($('fwd-payback')||{}).textContent=fmt(payback);
      ($('fwd-net')||{}).textContent=fmt(net);
      ($('fwd-fee')||{}).textContent=fmt(fee);
      ($('fwd-payment')||{}).textContent=fmt(payment)+' / '+(freqMode==='daily'?'day':'week');
      ($('fwd-cost')||{}).textContent=fmt(payback-fund);
      ($('fwd-term')||{}).textContent=nPay?termStr:'—';
    }
    [fi,fci,oi,pi].forEach(i=>i.oninput=recalc);
    recalc();
  }

  // ── REVERSE CALCULATOR — Merchant Funding Estimator (Phase 4) ─────────────
  // Reps enter what they see in the merchant's bank (deposit + payment +
  // frequency), then set/lock the deal variables they know (funding, factor,
  // term, origination fee). Suggest Clean iterates over clean round values
  // for any UNlocked variable and picks the combination whose calculated
  // payment is closest to the entered payment. Match Quality is heavily
  // weighted toward payment accuracy — that's the observation, everything
  // else is inference.
  {
    const fmt=n=>isNaN(n)||!isFinite(n)||!n?'—':'$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});

    // Working state: each variable has a value + a "locked" flag.
    const state={
      deposit:'',
      enteredPayment:'',
      frequency:'Weekly',          // 'Daily' or 'Weekly'
      funding:{val:'',locked:false},
      factor:{val:'',locked:false},
      term:{val:'',locked:false},      // Number of payments (days or weeks)
      origFee:{val:'3',locked:false},  // % — default 3% based on typical MCA
      payment:{val:'',locked:false},   // Calculated payment field (rarely locked)
    };

    const card=div({className:'card',style:{padding:'22px',marginBottom:'16px'}});
    const hdr=div({style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'6px',flexWrap:'wrap',gap:'8px'}});
    const hl=div({});
    hl.appendChild(div({style:{fontSize:'15px',fontWeight:'700',marginBottom:'3px'}},'Merchant Funding Estimator'));
    hl.appendChild(div({style:{fontSize:'12px',color:'#6b7280'}},'Reverse-engineer the deal from what you can see. Lock the variables you know.'));
    const headerBtns=div({style:{display:'flex',gap:'6px'}});
    const suggestBtn=btn({className:'btn btn-primary btn-sm'},'✨ Suggest Clean');
    const clrBtn2=btn({className:'btn btn-ghost btn-sm'},'Clear');
    headerBtns.appendChild(suggestBtn);headerBtns.appendChild(clrBtn2);
    hdr.appendChild(hl);hdr.appendChild(headerBtns);card.appendChild(hdr);

    const hint=div({style:{background:'#fef3c7',border:'1px solid #fde68a',borderRadius:'8px',padding:'10px 14px',fontSize:'12px',color:'#92400e',marginBottom:'16px'}});
    hint.textContent='Enter what you observe, then lock 🔒 any variable you already know. Click Suggest Clean to find the deal that best matches the payment.';
    card.appendChild(hint);

    const fld=(lbl,i,h2)=>{const f=div({style:{marginBottom:'14px'}});f.appendChild(div({style:{fontSize:'12px',fontWeight:'600',color:'#374151',marginBottom:'5px'}},lbl));if(h2)f.appendChild(div({style:{fontSize:'11px',color:'#9ca3af',marginBottom:'4px'}},h2));f.appendChild(i);return f;};

    // ── Section 1: Observed (entered by rep from bank statement) ─────
    card.appendChild(div({style:{fontSize:'11px',fontWeight:'700',color:'#6b7280',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:'10px'}},'1. What you observe'));

    const depI=inp({type:'number',placeholder:'e.g. 95000',style:{padding:'11px 13px',width:'100%'}});
    const pmtI=inp({type:'number',placeholder:'e.g. 5950',style:{padding:'11px 13px',width:'100%'}});
    const freqSel=sel({style:{padding:'11px 13px',width:'100%'}});
    ['Daily','Weekly'].forEach(v=>freqSel.appendChild(opt(v,v,state.frequency===v)));

    card.appendChild(fld('Deposit Seen in Bank ($)',depI,'What you see deposited from the funder'));
    card.appendChild(fld('Payment Amount ($) — this is what we match',pmtI,'Daily or weekly payment going out'));
    card.appendChild(fld('Payment Frequency',freqSel));

    // ── Section 2: Variables (with lock toggles) ─────────────────────
    card.appendChild(div({style:{fontSize:'11px',fontWeight:'700',color:'#6b7280',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:'10px',marginTop:'8px'}},'2. Deal variables (lock 🔒 what you know)'));

    // Each variable row: label + input + lock toggle. Locked = greyed bg,
    // value is preserved through Suggest Clean (only unlocked are tweaked).
    function lockableField(label,key,placeholder,step){
      const wrap=div({style:{marginBottom:'14px'}});
      wrap.appendChild(div({style:{fontSize:'12px',fontWeight:'600',color:'#374151',marginBottom:'5px'}},label));
      const row=div({style:{display:'flex',gap:'6px',alignItems:'center'}});
      const input=inp({type:'number',placeholder,step:step||'',style:{padding:'11px 13px',flex:'1'}});
      input.value=state[key].val;
      // Lock toggle — clicking flips state.<key>.locked and visually marks
      // the input grey. The Suggest Clean routine reads this flag to decide
      // which fields are search dimensions vs constants.
      const lockBtn=btn({style:{padding:'8px 12px',border:'1.5px solid',borderRadius:'7px',cursor:'pointer',fontFamily:'inherit',fontSize:'13px',fontWeight:'700',flexShrink:'0',transition:'all .12s'}});
      function paintLock(){
        const on=state[key].locked;
        lockBtn.textContent=on?'🔒 Locked':'🔓 Open';
        lockBtn.style.background=on?'#fef3c7':'#fff';
        lockBtn.style.borderColor=on?'#fbbf24':'#d1d5db';
        lockBtn.style.color=on?'#92400e':'#6b7280';
        input.style.background=on?'#fefce8':'#fff';
        input.style.fontWeight=on?'700':'400';
      }
      paintLock();
      lockBtn.onclick=ev=>{ev.preventDefault();state[key].locked=!state[key].locked;paintLock();recalc();};
      input.oninput=e=>{state[key].val=e.target.value;recalc();};
      row.appendChild(input);row.appendChild(lockBtn);
      wrap.appendChild(row);
      return wrap;
    }
    card.appendChild(lockableField('Funding Amount ($)','funding','e.g. 100000'));
    card.appendChild(lockableField('Factor Rate','factor','e.g. 1.40','0.001'));
    card.appendChild(lockableField('Number of Payments (term)','term','e.g. 24 (weeks) or 120 (days)'));
    card.appendChild(lockableField('Origination Fee (%)','origFee','e.g. 3','0.1'));

    revPanel.appendChild(card);

    // ── Section 3: Results — Match Quality + breakdown ───────────────
    const resCard2=div({className:'card',style:{padding:'22px'}});
    resCard2.appendChild(div({style:{fontSize:'13px',fontWeight:'700',marginBottom:'14px',color:'#374151'}},'Estimated Deal Structure'));

    const mkRow=(lbl,id,bold,note)=>{
      const r=div({style:{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'10px 0',borderBottom:'1px solid #f3f4f6',gap:'8px',flexWrap:'wrap'}});
      const left=div({});
      left.appendChild(div({style:{fontSize:'13px',color:'#6b7280'}},lbl));
      if(note)left.appendChild(div({style:{fontSize:'11px',color:'#9ca3af'}},note));
      const v=div({id,style:{fontSize:bold?'17px':'15px',fontWeight:bold?'800':'600',color:bold?brand():'#111',textAlign:'right'}});
      r.appendChild(left);r.appendChild(v);return r;
    };
    resCard2.appendChild(mkRow('Estimated Funded Amount','rev-funded',false,'After fee → matches deposit'));
    resCard2.appendChild(mkRow('Estimated Payback Amount','rev-payback',false,'Total they repay'));
    resCard2.appendChild(mkRow('Estimated Factor Rate','rev-factor',true,'Key number'));
    resCard2.appendChild(mkRow('Estimated Term','rev-term',false,'Total length'));
    resCard2.appendChild(mkRow('Total Cost of Capital','rev-cost',false,'Payback minus funded'));
    resCard2.appendChild(mkRow('Origination Fee $','rev-feeAmt',false,''));

    // Match Quality block — its own visual section so reps can scan it fast.
    const mqBox=div({style:{marginTop:'14px',padding:'14px',background:'#f9fafb',border:'1.5px solid #e5e7eb',borderRadius:'10px'}});
    mqBox.appendChild(div({style:{fontSize:'12px',fontWeight:'700',color:'#374151',marginBottom:'8px'}},'🎯 Match Quality'));

    // Score bar + label
    const scoreRow=div({style:{display:'flex',alignItems:'center',gap:'10px',marginBottom:'12px'}});
    const scoreBig=div({style:{fontSize:'22px',fontWeight:'800',minWidth:'70px',textAlign:'right'}},'—');
    const scoreBarOuter=div({style:{flex:'1',height:'10px',background:'#e5e7eb',borderRadius:'5px',overflow:'hidden'}});
    const scoreBar=div({style:{height:'100%',width:'0%',background:brand(),transition:'width .25s, background .25s'}});
    scoreBarOuter.appendChild(scoreBar);
    const scoreLabel=div({style:{fontSize:'12px',fontWeight:'600',color:'#6b7280',minWidth:'70px'}},'');
    scoreRow.appendChild(scoreBig);scoreRow.appendChild(scoreBarOuter);scoreRow.appendChild(scoreLabel);
    mqBox.appendChild(scoreRow);

    // Per-component breakdown: Entered vs Calculated payment, $ + % diff.
    const breakdownGrid=div({style:{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:'8px',fontSize:'12px'}});
    function mkBd(lbl,id){const c=div({style:{background:'#fff',border:'1px solid #e5e7eb',borderRadius:'6px',padding:'8px 10px'}});c.appendChild(div({style:{fontSize:'10px',color:'#6b7280',textTransform:'uppercase',letterSpacing:'.04em',marginBottom:'2px'}},lbl));const v=div({id,style:{fontWeight:'700',fontSize:'13px'}},'—');c.appendChild(v);return c;}
    breakdownGrid.appendChild(mkBd('Entered weekly pmt','mq-entered'));
    breakdownGrid.appendChild(mkBd('Calculated weekly pmt','mq-calc'));
    breakdownGrid.appendChild(mkBd('$ Difference','mq-dollardiff'));
    breakdownGrid.appendChild(mkBd('% Difference','mq-pctdiff'));
    mqBox.appendChild(breakdownGrid);

    // Verdict text — color-coded summary of the score.
    const verdict=div({style:{fontSize:'11px',marginTop:'10px',padding:'6px 10px',borderRadius:'6px',display:'none'}});
    mqBox.appendChild(verdict);

    resCard2.appendChild(mqBox);
    revPanel.appendChild(resCard2);

    // ── Math ─────────────────────────────────────────────────────────

    // Normalize term to days based on frequency. Term value is in the
    // frequency unit the user picked (Weekly → weeks; Daily → days).
    function termInDays(term,freq){
      const t=parseFloat(term)||0;
      return freq==='Weekly'?t*7:t;
    }
    // Per-period payment from (funding, factor, term). Term is in the
    // freq unit. Payment is per-period (per-day if Daily, per-week if Weekly).
    function calcPayment(funding,factor,term){
      if(!funding||!factor||!term)return 0;
      return (funding*factor)/term;
    }
    // Normalize per-period payment to weekly equivalent (for the "weekly
    // payment" display the user is matching against). Daily → multiply by 5
    // business days, Weekly → as-is.
    function toWeekly(pmtPerPeriod,freq){
      return freq==='Weekly'?pmtPerPeriod:pmtPerPeriod*5;
    }

    // Match Quality score — 0..100, payment-weighted heavily. Per spec:
    // Payment > Funding > Factor > Term > Fee. Payment hard-gates the
    // overall score: if the payment variance is large, total score is
    // capped well below "high" so a misleading green number can't show.
    function matchQuality({enteredPmt,calcPmt,enteredFunding,calcFunding,enteredFactor,calcFactor,enteredTerm,calcTerm,enteredFee,calcFee}){
      // Per-component pct-error score (0..1, where 1 = perfect).
      function pctScore(entered,calc){
        if(!entered||!calc||!isFinite(entered)||!isFinite(calc))return null;
        const pctErr=Math.abs(entered-calc)/Math.max(0.01,Math.abs(entered));
        // Linear taper: 0% error → 1.0; 20% error → 0.0.
        return Math.max(0,1-(pctErr/0.20));
      }
      const pPayment=pctScore(enteredPmt,calcPmt);
      const pFunding=pctScore(enteredFunding,calcFunding);
      const pFactor=pctScore(enteredFactor,calcFactor);
      const pTerm=pctScore(enteredTerm,calcTerm);
      const pFee=pctScore(enteredFee,calcFee);

      // Weights per spec. Payment dominates (50%); next biggest is funding
      // (20%); the rest taper down. Null components are skipped and the
      // remaining weights are re-normalized so missing inputs don't drag
      // the score down unfairly.
      const weighted=[
        [pPayment,50],
        [pFunding,20],
        [pFactor,15],
        [pTerm,10],
        [pFee,5],
      ];
      let totalWeight=0,sum=0;
      for(const [v,w] of weighted){if(v!==null){totalWeight+=w;sum+=v*w;}}
      let score=totalWeight>0?(sum/totalWeight)*100:0;
      // Hard cap: if payment is known and variance is large, refuse to
      // show a misleading "high" quality. >10% variance caps at 60;
      // >20% caps at 35. Forces honesty about how poor the fit is.
      if(pPayment!==null){
        const pmtErr=Math.abs(enteredPmt-calcPmt)/Math.max(0.01,Math.abs(enteredPmt));
        if(pmtErr>0.20)score=Math.min(score,35);
        else if(pmtErr>0.10)score=Math.min(score,60);
      }
      return Math.round(score);
    }

    // Build the "currently-implied" deal numbers from state. Funding is
    // derived from deposit + origFee if not entered, etc. Returns object
    // with funding, factor, term (in freq units), payment per period.
    function buildEstimate(s){
      const dep=parseFloat(s.deposit)||0;
      const entPmt=parseFloat(s.enteredPayment)||0;
      const freq=s.frequency;
      const origPct=parseFloat(s.origFee.val)||0;

      // Funding: explicit > inferred-from-deposit > 0.
      let funding=parseFloat(s.funding.val)||0;
      if(!funding&&dep&&origPct<100){funding=dep/(1-origPct/100);}

      // Factor: explicit > default 1.35 (typical MCA).
      let factor=parseFloat(s.factor.val)||0;
      // Term: explicit, else infer if we have funding + factor + payment.
      let term=parseFloat(s.term.val)||0;
      // If we don't have factor but we have funding/payment/term, solve for it.
      if(!factor&&funding&&entPmt&&term){
        const payback=entPmt*term;
        factor=payback/funding;
      }
      // If we don't have term but we have funding/factor/payment, solve.
      if(!term&&funding&&factor&&entPmt){
        term=(funding*factor)/entPmt;
      }
      // If we don't have funding but have factor/term/payment, solve.
      if(!funding&&factor&&term&&entPmt){
        funding=(entPmt*term)/factor;
      }

      const calcPmt=calcPayment(funding,factor,term);
      const calcWeekly=toWeekly(calcPmt,freq);
      const enteredWeekly=toWeekly(entPmt,freq);
      const fee=funding*(origPct/100);
      const payback=funding*factor;
      const termDays=termInDays(term,freq);

      return {dep,entPmt,freq,origPct,funding,factor,term,calcPmt,calcWeekly,enteredWeekly,fee,payback,termDays};
    }

    function recalc(){
      // Pull live values from inputs into state (lockable fields update
      // state.<key>.val on input already; just sync the observed section).
      state.deposit=depI.value;
      state.enteredPayment=pmtI.value;
      state.frequency=freqSel.value;

      const e=buildEstimate(state);

      // Results rows.
      const set=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=v;};
      set('rev-funded',e.funding?fmt(e.funding):'—');
      set('rev-payback',e.payback?fmt(e.payback):'—');
      set('rev-factor',e.factor?e.factor.toFixed(3)+'x':'—');
      set('rev-term',e.term?Math.round(e.term)+' '+(e.freq==='Weekly'?'weeks':'days')+(e.termDays?' ('+Math.round(e.termDays)+' days)':''):'—');
      set('rev-cost',(e.payback&&e.funding)?fmt(e.payback-e.funding):'—');
      set('rev-feeAmt',e.fee?fmt(e.fee):'—');

      // Match Quality
      const q=matchQuality({
        enteredPmt:e.enteredWeekly,
        calcPmt:e.calcWeekly,
        enteredFunding:parseFloat(state.funding.val)||null,
        calcFunding:e.funding||null,
        enteredFactor:parseFloat(state.factor.val)||null,
        calcFactor:e.factor||null,
        enteredTerm:parseFloat(state.term.val)||null,
        calcTerm:e.term||null,
        enteredFee:parseFloat(state.origFee.val)||null,
        calcFee:parseFloat(state.origFee.val)||null,
      });

      // Update the visual score block.
      const hasData=e.enteredWeekly>0&&e.calcWeekly>0;
      scoreBig.textContent=hasData?q+'/100':'—';
      scoreBar.style.width=hasData?q+'%':'0%';
      scoreBar.style.background=q>=80?'#16a34a':q>=60?'#eab308':q>=40?'#f97316':'#dc2626';
      scoreLabel.textContent=hasData?(q>=80?'Excellent':q>=60?'Good':q>=40?'Fair':'Poor'):'';

      // Per-component breakdown
      set('mq-entered',e.enteredWeekly?fmt(e.enteredWeekly)+'/wk':'—');
      set('mq-calc',e.calcWeekly?fmt(e.calcWeekly)+'/wk':'—');
      if(hasData){
        const dd=e.calcWeekly-e.enteredWeekly;
        const dpct=(dd/Math.max(0.01,e.enteredWeekly))*100;
        const ddEl=document.getElementById('mq-dollardiff');
        const dpEl=document.getElementById('mq-pctdiff');
        if(ddEl){ddEl.textContent=(dd>=0?'+':'')+fmt(Math.abs(dd)).replace('$',dd<0?'-$':'$');ddEl.style.color=Math.abs(dpct)<5?'#16a34a':Math.abs(dpct)<15?'#eab308':'#dc2626';}
        if(dpEl){dpEl.textContent=(dpct>=0?'+':'')+dpct.toFixed(1)+'%';dpEl.style.color=Math.abs(dpct)<5?'#16a34a':Math.abs(dpct)<15?'#eab308':'#dc2626';}
      } else {
        set('mq-dollardiff','—');set('mq-pctdiff','—');
      }

      // Verdict text under the score.
      if(hasData){
        verdict.style.display='block';
        if(q>=80){verdict.textContent='✓ Strong fit — these numbers reproduce the observed payment closely.';verdict.style.background='#f0fdf4';verdict.style.color='#166534';}
        else if(q>=60){verdict.textContent='Good fit — try Suggest Clean to tighten the unlocked variables.';verdict.style.background='#fefce8';verdict.style.color='#854d0e';}
        else if(q>=40){verdict.textContent='Loose fit — some variable is likely off. Lock what you know and try Suggest Clean.';verdict.style.background='#fff7ed';verdict.style.color='#9a3412';}
        else {verdict.textContent='Poor fit — payment variance is large. Try Suggest Clean or revisit your assumptions.';verdict.style.background='#fef2f2';verdict.style.color='#991b1b';}
      } else {
        verdict.style.display='none';
      }
    }

    // ── Suggest Clean ────────────────────────────────────────────────
    // Search over clean round values for any UNLOCKED variable. For each
    // combination, compute the calculated payment, score it against the
    // entered payment, and pick the best. Locked variables stay exactly
    // as the rep entered them.
    function suggestClean(){
      const entPmt=parseFloat(pmtI.value)||0;
      if(!entPmt){alert('Enter the observed payment first — Suggest Clean needs it to score.');return;}
      const freq=freqSel.value;
      const dep=parseFloat(depI.value)||0;
      const enteredWeekly=toWeekly(entPmt,freq);

      // Build search dimensions per field. Locked = single fixed value.
      // Unlocked = a list of "clean" candidates. Where the rep already
      // typed a value (but didn't lock), we anchor the search around it.
      function dim(key,cleanValues,anchor){
        if(state[key].locked){
          const v=parseFloat(state[key].val);
          return [isFinite(v)?v:0];
        }
        // If the rep typed an anchor value, generate candidates within a
        // tighter band around it; else use the full clean range.
        const a=parseFloat(state[key].val)||anchor;
        if(a){
          // Keep only candidates within ~30% of the anchor for speed.
          return cleanValues.filter(c=>Math.abs(c-a)/Math.max(0.01,Math.abs(a))<=0.35);
        }
        return cleanValues;
      }

      // Clean values per dimension.
      // Funding: $5K increments from $10K to $500K, plus $1K below $25K.
      const fundingCands=[];
      for(let f=10000;f<25000;f+=1000)fundingCands.push(f);
      for(let f=25000;f<=500000;f+=5000)fundingCands.push(f);
      // Factor: 0.01 increments 1.10..1.65.
      const factorCands=[];
      for(let x=110;x<=165;x++)factorCands.push(x/100);
      // Term: weekly mode → 1..65 weeks; daily mode → 5..200 days in steps of 5.
      const termCands=freq==='Weekly'
        ? Array.from({length:65},(_,i)=>i+4)               // 4..68 weeks
        : Array.from({length:40},(_,i)=>(i+5)*5);          // 25..200 days
      // OrigFee: 0..10% in 0.5 increments.
      const origCands=[];for(let p=0;p<=10;p+=0.5)origCands.push(+p.toFixed(1));

      // Anchor each dimension to either the rep's typed value or a sensible default.
      let fundingDim=dim('funding',fundingCands, dep?dep/0.97:100000);
      const factorDim=dim('factor',factorCands,1.40);
      const termDim=dim('term',termCands, freq==='Weekly'?24:120);
      const origDim=dim('origFee',origCands,3);

      // If funding wasn't explicitly given and not locked but deposit IS,
      // funding is a derived dependent: funding = deposit / (1 - orig/100).
      // We'll compute it per-iteration from deposit + orig in that case so
      // it stays consistent.
      const fundingDerived=(!state.funding.locked&&!parseFloat(state.funding.val)&&dep>0);
      if(fundingDerived)fundingDim=[null]; // placeholder; computed inside loop

      let best=null;
      for(const fund0 of fundingDim){
        for(const fact of factorDim){
          for(const term of termDim){
            for(const orig of origDim){
              const funding=fundingDerived?(dep/(1-orig/100)):fund0;
              if(!funding||!fact||!term)continue;
              const calcPmt=(funding*fact)/term;
              const calcWeekly=toWeekly(calcPmt,freq);
              const pmtErr=Math.abs(calcWeekly-enteredWeekly)/Math.max(0.01,enteredWeekly);
              // Build a lightweight "cleanliness" tiebreaker so among
              // equal-payment-fit candidates we prefer rounder factors
              // and rounder funding amounts.
              const cleanScore=
                (Math.abs(fact*100-Math.round(fact*100))<0.01?0:1)+    // factor cleanliness
                (funding%1000<1?0:1)+                                  // funding to nearest $1K
                (term%1<0.01?0:1);                                     // term integer
              const candidate={funding,factor:fact,term,origFee:orig,calcWeekly,pmtErr,cleanScore};
              if(!best||candidate.pmtErr<best.pmtErr-1e-6||
                 (Math.abs(candidate.pmtErr-best.pmtErr)<1e-6&&candidate.cleanScore<best.cleanScore)){
                best=candidate;
              }
            }
          }
        }
      }
      if(!best){alert('Could not find a clean fit. Check your inputs and try again.');return;}

      // Apply the chosen values back into state + inputs (only for unlocked
      // fields, of course). Triggers a final recalc to refresh the UI.
      if(!state.funding.locked){
        state.funding.val=Math.round(best.funding).toString();
      }
      if(!state.factor.locked){state.factor.val=best.factor.toFixed(2);}
      if(!state.term.locked){state.term.val=Math.round(best.term).toString();}
      if(!state.origFee.locked){state.origFee.val=best.origFee.toString();}
      // Repaint input values to reflect state.
      // Re-render the lockable inputs' values by directly setting them.
      // (Find each input element via its parent row by re-reading the DOM
      // would be brittle; instead re-render the whole card. For simplicity
      // and to keep this contained, we just set state and call recalc —
      // the inputs themselves keep their old values, so we update them
      // here directly.)
      const inputs=card.querySelectorAll('input[type="number"]');
      // Inputs in order in the card: dep, pmt, funding, factor, term, origFee.
      // (Number inputs only.)
      if(inputs[2]&&!state.funding.locked)inputs[2].value=state.funding.val;
      if(inputs[3]&&!state.factor.locked)inputs[3].value=state.factor.val;
      if(inputs[4]&&!state.term.locked)inputs[4].value=state.term.val;
      if(inputs[5]&&!state.origFee.locked)inputs[5].value=state.origFee.val;

      recalc();
    }

    suggestBtn.onclick=suggestClean;

    [depI,pmtI].forEach(i=>i.oninput=recalc);
    freqSel.onchange=recalc;
    clrBtn2.onclick=()=>{
      depI.value='';pmtI.value='';freqSel.value='Weekly';
      // Clear UNLOCKED values; preserve locked ones (rep deliberately set them).
      ['funding','factor','term','origFee'].forEach(k=>{if(!state[k].locked)state[k].val='';});
      state.deposit='';state.enteredPayment='';state.frequency='Weekly';
      // Repaint inputs.
      const inputs=card.querySelectorAll('input[type="number"]');
      if(inputs[2]&&!state.funding.locked)inputs[2].value='';
      if(inputs[3]&&!state.factor.locked)inputs[3].value='';
      if(inputs[4]&&!state.term.locked)inputs[4].value='';
      if(inputs[5]&&!state.origFee.locked)inputs[5].value='';
      recalc();
    };
    recalc();
  }

  wrap.appendChild(fwdPanel);
  wrap.appendChild(revPanel);
  container.appendChild(wrap);
}

async function renderSubmit(container){

  if(prefill)dni.value=prefill.deal_name;
  dealCard.appendChild(dni);wrap.appendChild(dealCard);
  if(prefill){

  const ni2=txt({placeholder:'Paste your deal summary here — this becomes the body of the email…',style:{padding:'10px 12px',width:'100%',height:'120px',resize:'vertical'}});
  if(prefill&&prefill.notes)ni2.value=prefill.notes;
  nc.appendChild(ni2);wrap.appendChild(nc);

  const dz=div({className:'drop-zone'});dz.innerHTML='<div style="font-size:20px;margin-bottom:4px">📁</div><div style="font-size:13px;font-weight:600;margin-bottom:2px">Drop files or click to browse</div><div style="font-size:11px;color:#9ca3af">All file types supported</div>';
  const fi2=inp({type:'file',multiple:'true',accept:'*/*',style:{display:'none'}});
  fi2.onchange=e=>handleFiles(e.target.files);dz.onclick=()=>fi2.click();
  dz.ondragover=e=>{e.preventDefault();dz.classList.add('drag');};dz.ondragleave=()=>dz.classList.remove('drag');
  dz.ondrop=e=>{e.preventDefault();dz.classList.remove('drag');handleFiles(e.dataTransfer.files);};
  const fl=div({style:{marginTop:'6px'}});
  function handleFiles(incoming){const ok=Array.from(incoming).filter(f=>f.name.match(/\.(pdf|jpg|jpeg|png|doc|docx|xls|xlsx)$/i));const names=new Set(files.map(f=>f.name));files=[...files,...ok.filter(f=>!names.has(f.name))].slice(0,30);renderFiles();}
  function renderFiles(){fl.innerHTML='';files.forEach(f=>{const r2=div({style:{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'7px 10px',background:'#f9fafb',border:'1px solid #e5e7eb',borderRadius:'6px',marginBottom:'4px'}});const ic=f.name.match(/\.pdf$/i)?'📄':f.name.match(/\.(jpg|jpeg|png)$/i)?'🖼':'📎';const l=div({style:{display:'flex',alignItems:'center',gap:'8px',fontSize:'12px'}});l.appendChild(span({},ic));l.appendChild(span({style:{fontWeight:'500'}},f.name));l.appendChild(span({style:{color:'#9ca3af',fontSize:'11px'}},'('+((f.size/1024/1024).toFixed(1))+' MB)'));const x=btn({style:{border:'none',background:'none',cursor:'pointer',fontSize:'18px',color:'#9ca3af',fontFamily:'inherit',padding:'0'}},'×');x.onclick=()=>{files=files.filter(fx=>fx.name!==f.name);renderFiles();};r2.appendChild(l);r2.appendChild(x);fl.appendChild(r2);});}
  attCard.appendChild(dz);attCard.appendChild(fi2);attCard.appendChild(fl);wrap.appendChild(attCard);

  // Rep selector — picking a rep automatically adds their email to CC.

  // The visible label list is the company-managed rep_list (free-form display

  if(autoCC)ccCard.appendChild(div({style:{fontSize:'11px',color:'#9ca3af',marginBottom:'6px'}},'Auto-CC: '+autoCC));
  const cci=inp({placeholder:'Additional CC: email@example.com, another@example.com',style:{padding:'9px 12px',width:'100%'}});ccCard.appendChild(cci);wrap.appendChild(ccCard);

  // Wire the rep selector to the CC field. Picking a rep prepends their email
  // to the CC list (deduped). Switching reps swaps the old rep's email out for
  // the new one. The user can still freely edit the CC field after.
  let lastAutoCcEmail='';
  repSel2.onchange=e=>{
    const repName=e.target.value;
    const newEmail=repName ? (teamMap[repName.trim().toLowerCase()]||'') : '';
    // Strip the previously-auto-added email, if any, from the CC list.
    let existing=(cci.value||'').split(',').map(s=>s.trim()).filter(Boolean);
    if(lastAutoCcEmail)existing=existing.filter(em=>em.toLowerCase()!==lastAutoCcEmail.toLowerCase());
    // Add the new rep's email if we have one.
    if(newEmail&&!existing.some(em=>em.toLowerCase()===newEmail.toLowerCase())){
      existing.unshift(newEmail);
    }
    cci.value=existing.join(', ');
    lastAutoCcEmail=newEmail;
    repEmailNote.textContent=newEmail?('→ '+newEmail+' added to CC'):(repName?'(no email on file for this rep)':'');
  };
  // Pre-select rep from the Shop tab handoff. Waits a tick so the team map
  // has time to load (CC auto-fill needs it). The change handler runs the
  // standard CC-prepending flow so the rep's email lands in CC automatically.

    setTimeout(()=>{

    },300);
  }

  // Funder selection by tier

  let selectedFunders=new Set(prefill&&prefill.preselect?Array.from(prefill.preselect):[]);
  const fc_badge=div({style:{display:selectedFunders.size?'inline':'none',background:'#dc2626',color:'#fff',borderRadius:'10px',padding:'1px 7px',fontSize:'11px',fontWeight:'700',marginLeft:'6px'}});
  if(selectedFunders.size)fc_badge.textContent=selectedFunders.size;
  const fHdr=div({style:{display:'flex',alignItems:'center',marginBottom:'10px'}});
  fHdr.appendChild(div({style:{fontSize:'13px',color:'#6b7280'}},'Choose which funders receive this deal'));fHdr.appendChild(fc_badge);
  fselCard.appendChild(fHdr);
  const tog=(name)=>{if(selectedFunders.has(name))selectedFunders.delete(name);else selectedFunders.add(name);};
  const tierTabs=div({style:{display:'flex',gap:'5px',flexWrap:'wrap',marginBottom:'12px'}});
  let activeTier=null;
  const tierContent=div({});
  const allTiers=[...new Set(FUNDERS.map(f=>f.tier))].sort();

  function buildPill(f,prefillSkip){
    const pill=div({style:{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'9px 12px',border:'1.5px solid',borderRadius:'7px',marginBottom:'6px',cursor:'pointer',userSelect:'none'}});
    pill.appendChild(span({style:{fontWeight:'600',fontSize:'13px'}},f.name));
    const chk=div({style:{width:'18px',height:'18px',borderRadius:'4px',border:'2px solid',display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontSize:'11px',flexShrink:'0',pointerEvents:'none'}});
    pill.appendChild(chk);
    const refresh=()=>{const on=selectedFunders.has(f.name);pill.style.background=on?'#f0fdf4':'#fff';pill.style.borderColor=on?'#16a34a':'#e5e7eb';chk.style.background=on?'#16a34a':'transparent';chk.style.borderColor=on?'#16a34a':'#d1d5db';chk.textContent=on?'✓':'';};
    refresh();
    pill.addEventListener('click',e=>{
      e.stopPropagation();e.preventDefault();
      if(selectedFunders.has(f.name))selectedFunders.delete(f.name);else selectedFunders.add(f.name);
      refresh();
      fc_badge.textContent=selectedFunders.size;fc_badge.style.display=selectedFunders.size?'inline':'none';
    });

  }

  function showTierFunders(tier){
    activeTier=tier;
    tierTabs.querySelectorAll('button').forEach(b=>{const on=b.dataset.tier===tier;b.style.background=on?brand():'#fff';b.style.color=on?'#fff':'#555';b.style.borderColor=on?brand():'#d1d5db';});
    tierContent.innerHTML='';

  }

  allTiers.forEach(tier=>{
    const b=btn({dataset:{tier},style:{padding:'5px 12px',border:'1.5px solid #d1d5db',borderRadius:'5px',fontSize:'12px',fontWeight:'600',cursor:'pointer',fontFamily:'inherit',background:'#fff',color:'#555'}},TM[tier]||tier);
    b.addEventListener('click',e=>{e.stopPropagation();showTierFunders(tier);});
    tierTabs.appendChild(b);
  });
  if(allTiers.length)showTierFunders(allTiers[0]);
  fselCard.appendChild(tierTabs);fselCard.appendChild(tierContent);

  // ── Custom / Ad-hoc funder ──────────────────────────────────────────────
  const customSep=div({style:{borderTop:'1px dashed #e5e7eb',margin:'14px 0 12px'}});
  fselCard.appendChild(customSep);
  fselCard.appendChild(div({style:{fontWeight:'600',fontSize:'12px',color:'#374151',marginBottom:'4px'}},'➕ Add a Funder Not on the List'));
  fselCard.appendChild(div({style:{fontSize:'11px',color:'#9ca3af',marginBottom:'10px'}},'Type a name and email — will be included in this send.'));
  let customFunders=[];
  const customRows=div({style:{marginBottom:'8px'}});
  fselCard.appendChild(customRows);
  function renderCustomRows(){
    customRows.innerHTML='';
    customFunders.forEach((cf,i)=>{
      const row=div({style:{display:'flex',gap:'8px',alignItems:'center',marginBottom:'6px',padding:'8px 10px',background:'#f9fafb',border:'1px solid #e5e7eb',borderRadius:'7px'}});
      const nI=inp({placeholder:'Funder / contact name',style:{flex:'1',padding:'7px 10px',fontSize:'13px'}});nI.value=cf.name;nI.oninput=e=>customFunders[i].name=e.target.value;
      const eI=inp({type:'email',placeholder:'email@funder.com',style:{flex:'2',padding:'7px 10px',fontSize:'13px'}});eI.value=cf.email;eI.oninput=e=>customFunders[i].email=e.target.value;
      const rm=btn({style:{padding:'6px 10px',border:'1px solid #fca5a5',color:'#dc2626',background:'none',borderRadius:'6px',cursor:'pointer',fontSize:'15px',lineHeight:'1',flexShrink:'0'}});rm.textContent='×';
      rm.onclick=()=>{customFunders.splice(i,1);renderCustomRows();updateBadge();};
      row.appendChild(nI);row.appendChild(eI);row.appendChild(rm);
      customRows.appendChild(row);
    });
  }
  const addCustomBtn=btn({className:'btn btn-ghost btn-sm'},'+ Add Custom Funder');

  fselCard.appendChild(addCustomBtn);

  function updateBadge(){
    const total=selectedFunders.size+customFunders.filter(c=>c.email.trim()).length;

  wrap.appendChild(fselCard);

  const errDiv=div({style:{display:'none',padding:'10px 14px',background:'#fef2f2',border:'1px solid #fca5a5',borderRadius:'6px',fontSize:'13px',color:'#991b1b',fontWeight:'600',marginBottom:'12px'}});
  const progCard=div({className:'card',style:{padding:'16px 20px',display:'none',marginBottom:'12px'}});
  const sendBtn=btn({className:'btn btn-primary',style:{fontSize:'14px',padding:'12px 28px',marginBottom:'8px',width:'100%',justifyContent:'center'}},'📤 Send to Funders →');
  wrap.appendChild(errDiv);wrap.appendChild(progCard);wrap.appendChild(sendBtn);

  let isSending=false;
  sendBtn.onclick=async()=>{
    if(isSending)return;
    if(!dni.value.trim()){errDiv.textContent='Business name required.';errDiv.style.display='block';return;}
    const validCustom=customFunders.filter(c=>c.email.trim());
    if(!selectedFunders.size&&!validCustom.length){errDiv.textContent='Select at least one funder, or add a custom funder with an email.';errDiv.style.display='block';return;}
    isSending=true;errDiv.style.display='none';sendBtn.disabled=true;sendBtn.textContent='Sending…';
    progCard.style.display='block';progCard.innerHTML='<div style="color:#6b7280;font-size:13px">Sending emails…</div>';
    const fundersToSend=[
      ...FUNDERS.filter(f=>selectedFunders.has(f.name)).map(f=>({name:f.name,tier:f.tier,emails:f.emails||[]})),
      ...validCustom.map(c=>({name:c.name||c.email,tier:'custom',emails:[c.email.trim()]}))
    ];
    const ccFinal=[autoCC,cci.value].filter(Boolean).join(', ');
    // Convert attachments to base64
    const attachments=await Promise.all(files.map(f=>new Promise((res,rej)=>{
      const r2=new FileReader();
      r2.onload=e=>res({filename:f.name,content:e.target.result.split(',')[1],encoding:'base64',contentType:f.type||'application/octet-stream'});
      r2.onerror=rej;
      r2.readAsDataURL(f);
    })));
    const r=await api.post('/api/send-emails',{deal_name:dni.value.trim(),notes:ni2.value,funders:fundersToSend,cc:ccFinal,attachments,existing_submission_id:prefill?prefill.submission_id:null});
    sendBtn.disabled=false;sendBtn.textContent='📤 Send to Funders →';isSending=false;
    progCard.innerHTML='';
    if(r.results){
      r.results.forEach(res=>{const row=div({style:{display:'flex',justifyContent:'space-between',padding:'6px 0',borderBottom:'1px solid #f3f4f6',fontSize:'13px'}});row.appendChild(span({style:{fontWeight:'600'}},res.name));row.appendChild(span({style:{color:res.status==='ok'?'#16a34a':res.status==='skipped'?'#d97706':'#dc2626'}},res.msg));progCard.appendChild(row);});
    }
    bustTab('submissions');
    // After successful send, offer to reset for next deal
    if(r.sent_from){
      const sentNote=div({style:{fontSize:'12px',color:'#6b7280',marginBottom:'8px',padding:'6px 10px',background:'#f9fafb',borderRadius:'6px'}});
      sentNote.textContent='Sent from: '+r.sent_from;
      progCard.insertBefore(sentNote,progCard.firstChild);

    if(r.results&&r.results.some(x=>x.status==='ok')){
      const resetRow=div({style:{marginTop:'10px',paddingTop:'10px',borderTop:'1px solid #f3f4f6'}});
      const resetBtn=btn({className:'btn btn-ghost',style:{fontSize:'13px',padding:'9px 18px'}},'📋 Submit Another Deal');
      resetBtn.onclick=()=>{bustTab('submit');showTab('submit');};

    }
  };
  container.appendChild(wrap);
}

// ── ACTIVE DEALS ──────────────────────────────────────────────────────────────
async function renderActiveDeals(container){
  container.innerHTML='';
  const isAdmin=['admin','superadmin'].includes(currentUser.role);
  const wrap=div({className:'page'});
  wrap.appendChild(div({className:'page-title'},'Active Deals'));
  // Scope note
  const scopeNote=div({style:{fontSize:'11px',color:'#9ca3af',marginBottom:'8px'}});
  if(isAdmin){scopeNote.textContent='Viewing all deals in your company.';}
  else if(currentUser.role==='team_leader'){scopeNote.textContent='Viewing your deals and your team\'s deals.';}
  else{scopeNote.textContent='Viewing your deals.';}
  wrap.appendChild(scopeNote);
  const co=await api.get('/api/company');
  const repList=JSON.parse(co.rep_list||'[]');
  // Filters
  // Funded deals live in their own "Funded Deals" tab now and are hidden
  // from Active Deals by default. Admins can flip this on to see them
  // alongside the active ones if they want a combined view.
  let filterRep='',filterStatus='',showFunded=false;
  if(isAdmin){
    const filters=div({style:{display:'flex',gap:'10px',marginBottom:'14px',flexWrap:'wrap',alignItems:'center'}});
    const rs=sel({style:{padding:'8px 10px'}});rs.appendChild(opt('','All Reps'));repList.forEach(r=>rs.appendChild(opt(r,r)));rs.onchange=e=>{filterRep=e.target.value;loadDeals();};
    // Status filter — Funded omitted from the default options since funded deals
    // have moved to their own tab. Selecting an explicit status still works.
    const ss=sel({style:{padding:'8px 10px'}});ss.appendChild(opt('','All Statuses (no Funded)'));STATUS_LIST.forEach(s=>ss.appendChild(opt(s,s)));ss.onchange=e=>{filterStatus=e.target.value;loadDeals();};
    filters.appendChild(rs);filters.appendChild(ss);
    // Optional "Show Funded" toggle so an admin can still see them in this view
    // if they need a unified list (e.g. quick search across everything).
    const sfLbl=el('label',{style:{display:'flex',alignItems:'center',gap:'6px',fontSize:'12px',cursor:'pointer',color:'#6b7280'}});
    const sfChk=inp({type:'checkbox'});sfChk.onchange=e=>{showFunded=e.target.checked;loadDeals();};
    sfLbl.appendChild(sfChk);sfLbl.appendChild(document.createTextNode(' Show Funded'));
    filters.appendChild(sfLbl);
    wrap.appendChild(filters);
  }
  const topRow=div({style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'14px',flexWrap:'wrap',gap:'10px'}});
  const newBtn=btn({className:'btn btn-primary'},'+ New Deal');
  const btnsRight=div({style:{display:'flex',gap:'8px',alignItems:'center'}});
  btnsRight.appendChild(newBtn);
  if(isAdmin){
    const csvBtn=btn({className:'btn btn-ghost btn-sm'},'⬇️ Export CSV');
    csvBtn.onclick=()=>{const a=document.createElement('a');a.href='/api/active-deals/csv';a.download='deals.csv';a.click();};
    btnsRight.appendChild(csvBtn);
  }
  topRow.appendChild(btnsRight);wrap.appendChild(topRow);
  const dealsList=div({});wrap.appendChild(dealsList);
  container.appendChild(wrap);

  async function loadDeals(){
    dealsList.innerHTML='<div style="color:#9ca3af;padding:20px;text-align:center">Loading…</div>';
    let deals=await api.get('/api/active-deals');
    if(filterRep)deals=deals.filter(d=>d.rep===filterRep);
    if(filterStatus)deals=deals.filter(d=>d.status===filterStatus);
    // Funded deals live in the Funded Deals tab. Hide them here unless either:
    //  (a) the admin explicitly toggled "Show Funded", or
    //  (b) they filtered for status === 'Funded' on purpose.
    else if(!showFunded)deals=deals.filter(d=>d.status!=='Funded');
    if(!deals.length){dealsList.innerHTML='<div style="color:#9ca3af;padding:40px;text-align:center;background:#fff;border-radius:10px;border:1px solid #e5e7eb">No deals yet.</div>';return;}
    dealsList.innerHTML='';
    deals.forEach(deal=>{
      const offers=deal.offers||[];
      const card=div({className:'card',style:{marginBottom:'8px',cursor:'pointer',padding:'14px 18px',display:'flex',alignItems:'flex-start',gap:'12px',transition:'box-shadow .12s'}});
      card.onmouseover=()=>card.style.boxShadow='0 2px 8px rgba(0,0,0,.1)';
      card.onmouseout=()=>card.style.boxShadow='';
      const left=div({style:{flex:'1',minWidth:'0'}});
      const titleRow=div({style:{display:'flex',alignItems:'center',gap:'8px',flexWrap:'wrap',marginBottom:'4px'}});
      titleRow.appendChild(div({style:{fontWeight:'700',fontSize:'14px'}},deal.deal_name));
      const sb=div({className:'badge s-'+(deal.status||'New')},deal.status||'New');
      titleRow.appendChild(sb);
      if(deal.rep)titleRow.appendChild(span({style:{fontSize:'12px',color:'#6b7280',background:'#f3f4f6',padding:'2px 8px',borderRadius:'4px'}},deal.rep));
      left.appendChild(titleRow);
      const meta=div({style:{fontSize:'12px',color:'#9ca3af',display:'flex',gap:'12px',flexWrap:'wrap'}});
      if(deal.first_name||deal.last_name)meta.appendChild(span({},(deal.first_name+' '+deal.last_name).trim()));
      if(deal.phone)meta.appendChild(span({},deal.phone));
      if(deal.deal_date)meta.appendChild(span({},fmtDate(deal.deal_date)));
      left.appendChild(meta);
      // Offers
      if(offers.length){
        const ofs=div({style:{marginTop:'6px',display:'flex',gap:'6px',flexWrap:'wrap'}});
        offers.forEach(o=>{
          // Read funding_amount (new shape) or amount (legacy). Highlight the
          // accepted offer with a brighter border so reps can see at a glance
          // which one is the chosen offer when scanning the pipeline.
          const amt=o.funding_amount||o.amount;
          const isAccepted=!!o.accepted;
          const chip=div({style:{fontSize:'11px',fontWeight:'600',padding:'3px 10px',background:isAccepted?'#d1fae5':'#f0fdf4',border:'1px solid '+(isAccepted?'#16a34a':'#bbf7d0'),borderRadius:'12px',color:'#065f46'}});
          chip.textContent=(isAccepted?'✓ ':'')+(o.funder||'(funder)')+(amt?' — '+fmt$(amt):'');
          ofs.appendChild(chip);
        });
        left.appendChild(ofs);
      }
      card.appendChild(left);
      // Quick status change on right side
      const statusSel=sel({style:{padding:'5px 8px',fontSize:'11px',fontWeight:'700',borderRadius:'5px',border:'1.5px solid #e5e7eb',cursor:'pointer',flexShrink:'0',background:'transparent'}});
      STATUS_LIST.forEach(s=>statusSel.appendChild(opt(s,s,s===(deal.status||'New'))));
      statusSel.onclick=e=>e.stopPropagation();
      statusSel.onchange=async e=>{
        const newS=e.target.value;
        const r=await api.put('/api/active-deals/'+deal.id,{...deal,status:newS});
        if(r.ok){deal.status=newS;sb.textContent=newS;sb.className='status-badge s-'+newS;}
        else{statusSel.value=deal.status||'New';}
      };
      card.appendChild(statusSel);
      card.onclick=()=>openDealModal(deal,repList,loadDeals);
      dealsList.appendChild(card);
    });
  }
  newBtn.onclick=()=>openDealModal(null,repList,loadDeals);
  loadDeals();
}

  else{scopeNote.textContent='Viewing your funded deals.';}

  const co=await api.get('/api/company');

  let filterRep='';
  if(isAdmin&&repList.length){

    wrap.appendChild(filters);
  }

  // Summary banner — 3 portfolio-level stats: total funded, total still
  // outstanding (sum of remaining balances), and count of deals currently
  // eligible for renewal. Helps reps spot renewal opportunities at a glance.
  const banner=div({className:'card',style:{padding:'14px 20px',marginBottom:'14px',display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(160px,1fr))',gap:'16px',alignItems:'center'}});
  function statCell(label,valColor){
    const c=div({});
    c.appendChild(div({style:{fontSize:'11px',color:'#9ca3af',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:'2px'}},label));
    const v=div({style:{fontSize:'22px',fontWeight:'800',color:valColor||'#111'}},'-');
    c.appendChild(v);
    return {el:c,val:v};
  }
  const totalCell=statCell('Total Funded');
  const outstandingCell=statCell('Total Outstanding','#0369a1');
  const renewalCell=statCell('Renewal Eligible','#166534');
  const countCell=statCell('Deals');
  banner.appendChild(totalCell.el);banner.appendChild(outstandingCell.el);
  banner.appendChild(renewalCell.el);banner.appendChild(countCell.el);
  // Backwards-compat: leave the old variable names pointing at the new cells
  // so the loadFunded() code below doesn't need to change shape.
  const totalEl=totalCell.val;
  const countEl=countCell.val;
  wrap.appendChild(banner);

  const dealsList=div({});wrap.appendChild(dealsList);
  container.appendChild(wrap);

  async function loadFunded(){
    dealsList.innerHTML='<div style="color:#9ca3af;padding:20px;text-align:center">Loading…</div>';
    let deals=await api.get('/api/active-deals');
    deals=deals.filter(d=>d.status==='Funded');
    if(filterRep)deals=deals.filter(d=>d.rep===filterRep);
    // Most recent funded first — easier for reps to find what they just closed.
    deals.sort((a,b)=>new Date(b.updated_at||b.created_at)-new Date(a.updated_at||a.created_at));

    // Total funded amount — read from funded_details.funded_amount when
    // present (most accurate), else fall back to the accepted offer's
    // funding_amount, else the first offer's amount (legacy data).
    function fundedAmtOf(d){
      const fd=d.funded_details;
      if(fd&&fd.funded_amount)return parseFloat(fd.funded_amount)||0;
      const offers=d.offers||[];
      const accepted=offers.find(o=>o&&o.accepted);
      const src=accepted||offers[0];
      if(!src)return 0;
      return parseFloat(src.funding_amount||src.amount||0)||0;
    }
    const total=deals.reduce((s,d)=>s+fundedAmtOf(d),0);
    // Portfolio-wide outstanding balance + renewal-eligible deal count,
    // both derived from each deal's paydown stats. Skips deals whose
    // funded_details don't have enough info to compute (those just don't
    // contribute, which is the right behavior — we can't fake the number).
    let outstanding=0,eligibleCount=0;
    deals.forEach(d=>{
      const s=paydownStats(d.funded_details);
      if(s){outstanding+=s.remaining;if(s.isEligible)eligibleCount++;}
    });
    totalEl.textContent=fmt$(total);
    outstandingCell.val.textContent=fmt$(outstanding);
    renewalCell.val.textContent=String(eligibleCount);
    countEl.textContent=String(deals.length);

    if(!deals.length){dealsList.innerHTML='<div style="color:#9ca3af;padding:40px;text-align:center;background:#fff;border-radius:10px;border:1px solid #e5e7eb">No funded deals yet. When you mark a deal "Funded" in Active Deals, it shows up here.</div>';return;}
    dealsList.innerHTML='';

    deals.forEach(deal=>{
      const offers=deal.offers||[];
      const fd=deal.funded_details;
      const card=div({className:'card',style:{marginBottom:'8px',cursor:'pointer',padding:'14px 18px',display:'flex',alignItems:'flex-start',gap:'12px',transition:'box-shadow .12s',borderLeft:'3px solid #16a34a'}});
      card.onmouseover=()=>card.style.boxShadow='0 2px 8px rgba(0,0,0,.1)';
      card.onmouseout=()=>card.style.boxShadow='';
      const leftCol=div({style:{flex:'1',minWidth:'0'}});

      const titleRow=div({style:{display:'flex',alignItems:'center',gap:'8px',flexWrap:'wrap',marginBottom:'4px'}});
      titleRow.appendChild(div({style:{fontWeight:'700',fontSize:'14px'}},deal.deal_name));
      titleRow.appendChild(div({className:'badge s-Funded',style:{background:'#d1fae5',color:'#065f46',padding:'2px 9px',borderRadius:'10px',fontSize:'11px',fontWeight:'700'}},'Funded'));
      if(deal.rep)titleRow.appendChild(span({style:{fontSize:'12px',color:'#6b7280',background:'#f3f4f6',padding:'2px 8px',borderRadius:'4px'}},deal.rep));
      // Show funded amount + funder prominently in the title row when known.
      const amt=fundedAmtOf(deal);
      if(amt)titleRow.appendChild(span({style:{fontSize:'13px',fontWeight:'700',color:'#16a34a',marginLeft:'auto'}},fmt$(amt)));
      leftCol.appendChild(titleRow);

      const meta=div({style:{fontSize:'12px',color:'#9ca3af',display:'flex',gap:'12px',flexWrap:'wrap'}});
      if(deal.first_name||deal.last_name)meta.appendChild(span({},(deal.first_name+' '+deal.last_name).trim()));
      if(deal.phone)meta.appendChild(span({},deal.phone));
      // Prefer the funded_details funder + date; fall back to deal_date.
      if(fd&&fd.funder)meta.appendChild(span({style:{color:'#065f46',fontWeight:'600'}},'Funder: '+fd.funder));
      if(fd&&fd.funded_date)meta.appendChild(span({},'Funded: '+fmtDate(fd.funded_date)));
      else if(deal.deal_date)meta.appendChild(span({},fmtDate(deal.deal_date)));
      // Term + payment summary — gives a quick scan of structure without opening modal.
      if(fd&&fd.term)meta.appendChild(span({},'Term: '+fd.term+' '+(fd.term_unit||'days')));
      if(fd&&fd.scheduled_payment)meta.appendChild(span({},'Payment: '+fmt$(fd.scheduled_payment)+' '+(fd.payment_frequency||'')));
      leftCol.appendChild(meta);

      // Offer chips — show all offers, accepted one highlighted.
      if(offers.length){
        const ofs=div({style:{marginTop:'6px',display:'flex',gap:'6px',flexWrap:'wrap'}});
        offers.forEach(o=>{
          const amt=o.funding_amount||o.amount;
          const isAccepted=!!o.accepted;
          const chip=div({style:{fontSize:'11px',fontWeight:'600',padding:'3px 10px',background:isAccepted?'#d1fae5':'#f0fdf4',border:'1px solid '+(isAccepted?'#16a34a':'#bbf7d0'),borderRadius:'12px',color:'#065f46'}});
          chip.textContent=(isAccepted?'✓ ':'')+(o.funder||'(funder)')+(amt?' — '+fmt$(amt):'');
          ofs.appendChild(chip);
        });
        leftCol.appendChild(ofs);
      }

      // ── Inline paydown summary ────────────────────────────────────
      // Compact progress bar + one-liner so reps can scan paydown
      // status across the whole portfolio without opening each deal.
      // Hidden when funded_details lacks the inputs needed to compute.
      const stats=paydownStats(fd);
      if(stats){
        const pdWrap=div({style:{marginTop:'10px'}});
        const pdRow=div({style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'4px',fontSize:'11px',color:'#374151',gap:'8px',flexWrap:'wrap'}});
        const pdLeft=div({style:{fontWeight:'700'}});
        pdLeft.textContent=stats.pct.toFixed(1)+'% paid in';
        const pdRight=div({style:{color:'#6b7280'}});
        pdRight.textContent=fmt$(stats.remaining)+' remaining · '+stats.remainingPeriods+' '+freqLabel(stats.freq)+(stats.remainingPeriods===1?'':'s')+' left';
        pdRow.appendChild(pdLeft);pdRow.appendChild(pdRight);
        pdWrap.appendChild(pdRow);
        pdWrap.appendChild(paydownBar(stats.pct,'6px'));
        // Renewal eligibility chip — only shown when meaningful (eligible OR close).
        if(stats.isEligible){
          const elChip=div({style:{display:'inline-block',marginTop:'5px',padding:'2px 9px',background:'#dcfce7',color:'#166534',border:'1px solid #86efac',borderRadius:'10px',fontSize:'10px',fontWeight:'700'}},'✓ Eligible for renewal');
          pdWrap.appendChild(elChip);
        } else if(stats.periodsUntilEligible>0&&stats.periodsUntilEligible<=20){
          // Within 20 periods of eligibility — surface a hint so reps can
          // plan ahead. Avoids cluttering deals that just funded last week.
          const soonChip=div({style:{display:'inline-block',marginTop:'5px',padding:'2px 9px',background:'#fef3c7',color:'#92400e',border:'1px solid #fde68a',borderRadius:'10px',fontSize:'10px',fontWeight:'700'}},'⏳ Renewal in ~'+stats.periodsUntilEligible+' '+freqLabel(stats.freq)+(stats.periodsUntilEligible===1?'':'s'));
          pdWrap.appendChild(soonChip);
        }
        leftCol.appendChild(pdWrap);
      }

      card.appendChild(leftCol);

      // Status changer on the right — lets you "unfund" a deal by sending it
      // back to Working/Approved/etc. Mirrors the Active Deals UX.
      const statusSel=sel({style:{padding:'5px 8px',fontSize:'11px',fontWeight:'700',borderRadius:'5px',border:'1.5px solid #e5e7eb',cursor:'pointer',flexShrink:'0',background:'transparent'}});
      STATUS_LIST.forEach(s=>statusSel.appendChild(opt(s,s,s===deal.status)));
      statusSel.onclick=e=>e.stopPropagation();
      statusSel.onchange=async e=>{
        const newS=e.target.value;
        const r=await api.put('/api/active-deals/'+deal.id,{...deal,status:newS});
        if(r.ok){loadFunded();}
        else{statusSel.value=deal.status;}
      };
      card.appendChild(statusSel);

      card.onclick=()=>openDealModal(deal,repList,loadFunded);
      dealsList.appendChild(card);
    });
  }
  loadFunded();
}

function openDealModal(deal,repList,onSave){
  const isNew=!deal;
  $('deal-modal-title').textContent=isNew?'New Deal':deal.deal_name;
  const body=$('deal-modal-body');body.innerHTML='';
  const d={deal_name:deal?.deal_name||'',first_name:deal?.first_name||'',last_name:deal?.last_name||'',phone:deal?.phone||'',email:deal?.email||'',rep:deal?.rep||'',deal_date:deal?.deal_date||'',notes:deal?.notes||'',offers:deal?.offers||[],status:deal?.status||'New'};
  const isAdmin=['admin','superadmin'].includes(currentUser.role);

  const g=div({style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px',marginBottom:'14px'}});
  const fld=(lbl,i)=>{const f=div({});f.appendChild(div({style:{fontSize:'12px',fontWeight:'600',color:'#374151',marginBottom:'5px'}},lbl));f.appendChild(i);return f;};
  const dni=inp({placeholder:'Business / Deal Name *',style:{padding:'9px 11px',width:'100%',gridColumn:'1/-1'}});dni.value=d.deal_name;dni.oninput=e=>d.deal_name=e.target.value;
  const fni=inp({style:{padding:'9px 11px',width:'100%'}});fni.value=d.first_name;fni.oninput=e=>d.first_name=e.target.value;
  const lni=inp({style:{padding:'9px 11px',width:'100%'}});lni.value=d.last_name;lni.oninput=e=>d.last_name=e.target.value;
  const phi=inp({style:{padding:'9px 11px',width:'100%'},placeholder:'(555) 555-5555'});phi.value=d.phone;phi.oninput=e=>d.phone=e.target.value;
  const emi=inp({type:'email',style:{padding:'9px 11px',width:'100%'},placeholder:'owner@business.com'});emi.value=d.email;emi.oninput=e=>d.email=e.target.value;
  const di=inp({type:'date',style:{padding:'9px 11px',width:'100%'}});di.value=d.deal_date;di.oninput=e=>d.deal_date=e.target.value;
  const repSel=sel({style:{padding:'9px 11px',width:'100%'}});repSel.appendChild(opt('','Select rep…'));repList.forEach(r=>repSel.appendChild(opt(r,r,d.rep===r)));repSel.onchange=e=>d.rep=e.target.value;
  const ni=txt({placeholder:'Notes…',style:{padding:'9px 11px',width:'100%',height:'80px',resize:'vertical'}});ni.value=d.notes;ni.oninput=e=>d.notes=e.target.value;
  const statusFld=div({style:{gridColumn:'1/-1'}});
  statusFld.appendChild(div({style:{fontSize:'12px',fontWeight:'600',color:'#374151',marginBottom:'5px'}},'Status'));
  const statusSelM=sel({style:{padding:'9px 11px',width:'100%'}});STATUS_LIST.forEach(s=>statusSelM.appendChild(opt(s,s,d.status===s)));statusSelM.onchange=e=>d.status=e.target.value;
  statusFld.appendChild(statusSelM);
  g.appendChild(fld('Deal Name',dni));g.appendChild(fld('First Name',fni));g.appendChild(fld('Last Name',lni));
  g.appendChild(fld('Phone',phi));g.appendChild(fld('Email',emi));g.appendChild(fld('Date',di));
  g.appendChild(fld('Rep',repSel));g.appendChild(statusFld);
  body.appendChild(g);
  body.appendChild(fld('Notes',ni));

  // Normalize offers to the multi-field shape on load. Old data was
  // {funder, amount}; new shape adds funding_amount, factor_rate, term,
  // term_unit, fees, payment_amount, payment_frequency, notes, accepted.
  // We coerce `amount` → `funding_amount` for back-compat so users don't
  // lose data when this build first deploys.
  d.offers=(d.offers||[]).map(o=>({
    funder:o.funder||'',
    funding_amount:o.funding_amount??o.amount??'',
    factor_rate:o.factor_rate??'',
    term:o.term??'',
    term_unit:o.term_unit||'days',
    fees:o.fees??'',
    payment_amount:o.payment_amount??'',
    payment_frequency:o.payment_frequency||'daily',
    notes:o.notes||'',
    accepted:!!o.accepted,
  }));
  // funded_details is round-tripped to the server. Use the existing value
  // from the deal record (will be auto-populated on first transition to
  // Funded if the user marked an offer accepted).
  d.funded_details=deal?.funded_details||null;

  // ── OFFERS SECTION ───────────────────────────────────────────────────
  // Each offer is a full record (6 fields + notes + accepted flag). The
  // section header has a "Compare" toggle that swaps between stacked
  // cards (default — easier to edit one at a time) and a side-by-side
  // table (easier to compare numbers across offers).
  const offersSec=div({style:{marginTop:'16px'}});
  const offersHdr=div({style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'8px'}});
  offersHdr.appendChild(div({style:{fontSize:'12px',fontWeight:'700',color:'#374151'}},'💰 Offers Received'));
  const compareBtn=btn({className:'btn btn-ghost btn-sm',style:{fontSize:'11px',padding:'4px 10px'}},'⇆ Compare');
  let compareMode=false;
  offersHdr.appendChild(compareBtn);
  offersSec.appendChild(offersHdr);
  const offersWrap=div({});
  offersSec.appendChild(offersWrap);
  body.appendChild(offersSec);

  // Small reusable label cell so each offer field looks consistent.
  function fldMini(lbl,input){
    const f=div({});
    f.appendChild(div({style:{fontSize:'10px',fontWeight:'600',color:'#6b7280',marginBottom:'3px',textTransform:'uppercase',letterSpacing:'.04em'}},lbl));
    f.appendChild(input);
    return f;
  }
  function fmtMoney(v){if(!v||isNaN(v))return '—';return '$'+Number(v).toLocaleString();}

  function renderOffersStacked(){
    offersWrap.innerHTML='';
    d.offers.forEach((o,i)=>{
      // Each offer is its own card with a green accent if accepted.
      const card=div({style:{border:'1.5px solid '+(o.accepted?'#16a34a':'#e5e7eb'),background:o.accepted?'#f0fdf4':'#fff',borderRadius:'10px',padding:'12px 14px',marginBottom:'10px'}});

      // Top row: funder name (wide) + Accepted radio + remove ×.
      const topRow=div({style:{display:'flex',alignItems:'center',gap:'10px',marginBottom:'10px'}});
      const funderInput=inp({placeholder:'Funder name *',style:{flex:'1',padding:'8px 10px',fontWeight:'600'}});
      funderInput.value=o.funder;funderInput.oninput=e=>{d.offers[i].funder=e.target.value;};
      topRow.appendChild(funderInput);

      // Accepted toggle — clicking sets THIS offer as accepted and unsets
      // any others. Visual feedback: green border + bg when accepted.
      const acceptLbl=el('label',{style:{display:'flex',alignItems:'center',gap:'6px',fontSize:'12px',cursor:'pointer',color:'#065f46',fontWeight:'600',flexShrink:'0'}});
      const acceptChk=inp({type:'checkbox',style:{width:'16px',height:'16px',cursor:'pointer'}});
      acceptChk.checked=o.accepted;
      acceptChk.onchange=e=>{
        const wasOn=e.target.checked;
        // Only one offer can be accepted at a time. Clear others before
        // setting this one so the data stays consistent.
        d.offers.forEach((x,idx)=>{x.accepted=wasOn&&idx===i;});
        renderOffersStacked();
      };
      acceptLbl.appendChild(acceptChk);acceptLbl.appendChild(document.createTextNode(' Accepted'));
      topRow.appendChild(acceptLbl);

      const rm=btn({style:{border:'none',background:'none',cursor:'pointer',color:'#9ca3af',fontSize:'20px',padding:'0',fontFamily:'inherit',flexShrink:'0'}},'×');
      rm.title='Remove this offer';
      rm.onclick=()=>{d.offers.splice(i,1);renderOffersStacked();};
      topRow.appendChild(rm);
      card.appendChild(topRow);

      // Field grid — three columns on desktop, fits all 5 numeric fields
      // plus units in one compact block. Inputs are number-typed where
      // possible so the on-screen keyboard shows numerics on mobile.
      const grid=div({style:{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(120px,1fr))',gap:'8px',marginBottom:'8px'}});

      const fai=inp({type:'number',placeholder:'0',style:{padding:'7px 9px',width:'100%'}});fai.value=o.funding_amount;fai.oninput=e=>{d.offers[i].funding_amount=e.target.value;};
      grid.appendChild(fldMini('Funding $',fai));

      const fri=inp({type:'number',step:'0.01',placeholder:'1.35',style:{padding:'7px 9px',width:'100%'}});fri.value=o.factor_rate;fri.oninput=e=>{d.offers[i].factor_rate=e.target.value;};
      grid.appendChild(fldMini('Factor',fri));

      // Term + term unit combined into one cell so a "60 / days" combo
      // takes a single column instead of two.
      const termCell=div({style:{display:'flex',gap:'4px'}});
      const tri=inp({type:'number',placeholder:'60',style:{flex:'1',padding:'7px 9px',minWidth:'0'}});tri.value=o.term;tri.oninput=e=>{d.offers[i].term=e.target.value;};
      const tui=sel({style:{padding:'7px 4px',fontSize:'11px'}});['days','weeks','months'].forEach(u=>tui.appendChild(opt(u,u,o.term_unit===u)));tui.onchange=e=>{d.offers[i].term_unit=e.target.value;};
      termCell.appendChild(tri);termCell.appendChild(tui);
      grid.appendChild(fldMini('Term',termCell));

      const fei=inp({type:'number',placeholder:'0',style:{padding:'7px 9px',width:'100%'}});fei.value=o.fees;fei.oninput=e=>{d.offers[i].fees=e.target.value;};
      grid.appendChild(fldMini('Fees $',fei));

      const pai=inp({type:'number',placeholder:'0',style:{padding:'7px 9px',width:'100%'}});pai.value=o.payment_amount;pai.oninput=e=>{d.offers[i].payment_amount=e.target.value;};
      grid.appendChild(fldMini('Payment $',pai));

      const pfi=sel({style:{padding:'7px 6px',width:'100%',fontSize:'12px'}});['daily','weekly','bi-weekly','monthly'].forEach(p=>pfi.appendChild(opt(p,p,o.payment_frequency===p)));pfi.onchange=e=>{d.offers[i].payment_frequency=e.target.value;};
      grid.appendChild(fldMini('Pay freq',pfi));

      card.appendChild(grid);

      // Notes — full width, single line input. (Two lines available via
      // text wrap if needed; doesn't bloat the modal vertically.)
      const noteI=inp({placeholder:'Notes about this offer (optional)',style:{padding:'7px 9px',width:'100%',fontSize:'12px'}});
      noteI.value=o.notes;noteI.oninput=e=>{d.offers[i].notes=e.target.value;};
      card.appendChild(noteI);

      offersWrap.appendChild(card);
    });
    const addBtn=btn({className:'btn btn-ghost btn-sm'},'+ Add Another Offer');
    addBtn.onclick=()=>{
      d.offers.push({funder:'',funding_amount:'',factor_rate:'',term:'',term_unit:'days',fees:'',payment_amount:'',payment_frequency:'daily',notes:'',accepted:false});
      renderOffersStacked();
    };
    offersWrap.appendChild(addBtn);
  }

  function renderOffersCompare(){
    offersWrap.innerHTML='';
    if(d.offers.length===0){
      offersWrap.appendChild(div({style:{padding:'18px',textAlign:'center',color:'#9ca3af',background:'#f9fafb',border:'1px dashed #e5e7eb',borderRadius:'8px',fontSize:'12px'}},'No offers to compare yet. Switch back to edit mode to add one.'));
      return;
    }
    // Side-by-side table. Each row is a field; each column is an offer.
    // Read-only here — use the Compare button again to flip back to edit.
    const wrapTbl=div({style:{overflowX:'auto',border:'1px solid #e5e7eb',borderRadius:'8px'}});
    const tbl=el('table',{style:{width:'100%',borderCollapse:'collapse',fontSize:'12px'}});
    const headerRow=el('tr');
    headerRow.appendChild(el('th',{style:{padding:'8px 10px',textAlign:'left',background:'#f9fafb',borderBottom:'1px solid #e5e7eb',fontWeight:'700',color:'#6b7280',fontSize:'11px',textTransform:'uppercase'}},'Field'));
    d.offers.forEach((o,i)=>{
      const th=el('th',{style:{padding:'8px 10px',textAlign:'left',background:o.accepted?'#f0fdf4':'#f9fafb',borderBottom:'1px solid #e5e7eb',fontWeight:'700',fontSize:'12px',color:o.accepted?'#065f46':'#111',minWidth:'130px'}});
      th.textContent=(o.funder||('Offer '+(i+1)))+(o.accepted?' ✓':'');
      headerRow.appendChild(th);

    tbl.appendChild(headerRow);
    const rows=[
      ['Funding $',o=>fmtMoney(o.funding_amount)],
      ['Factor',o=>o.factor_rate||'—'],
      ['Term',o=>o.term?(o.term+' '+o.term_unit):'—'],
      ['Fees $',o=>fmtMoney(o.fees)],
      ['Payment $',o=>fmtMoney(o.payment_amount)],
      ['Pay freq',o=>o.payment_frequency||'—'],
      ['Notes',o=>o.notes||''],
    ];
    rows.forEach(([lbl,fn])=>{
      const tr=el('tr');
      tr.appendChild(el('td',{style:{padding:'6px 10px',color:'#6b7280',fontWeight:'600',borderBottom:'1px solid #f3f4f6'}},lbl));
      d.offers.forEach(o=>{
        const td=el('td',{style:{padding:'6px 10px',borderBottom:'1px solid #f3f4f6',color:'#111'}});
        td.textContent=fn(o);
        tr.appendChild(td);
      });
      tbl.appendChild(tr);
