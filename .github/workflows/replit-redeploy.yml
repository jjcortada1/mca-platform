name: Redeploy to Replit

on:
  push:
    branches:
      - main

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Replit deployment
        run: |
          # Replit listens for git changes automatically
          # This workflow ensures the deployment is triggered
          echo "Deployment triggered for main branch"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
